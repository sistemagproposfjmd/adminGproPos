<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catálogo de Productos</title>
  <style>
    /* ============================================================
       VARIABLES & TEMA APPSHEET PRO
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --as-bg: #071513;
      --as-card: rgba(12, 32, 29, 0.94);
      --as-card-strong: #0B211E;
      --as-ink: #EAF4F1;
      --as-ink-dim: #B7CCC6;
      --as-mut: #8FA8A2;
      --as-amber: #F3B23E;
      --as-amber-bg: rgba(243, 178, 62, 0.16);
      --as-amber-d: #0B211E;
      --as-teal: #3FD9A8;
      --as-teal-bg: rgba(63, 217, 168, 0.16);
      --as-red: #F0705F;
      --as-blue: #7FD4FF;
      --as-border: rgba(255, 255, 255, 0.12);
      --as-shadow: 0 8px 24px rgba(0,0,0,0.5);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      min-height: 100dvh;
      background: var(--as-bg);
      color: var(--as-ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(95px + env(safe-area-inset-bottom, 0px));
    }

    /* ============================================================
       CABECERA
    ============================================================ */
    .as-header {
      position: sticky; top: 0; z-index: 50;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      background: rgba(10, 26, 24, 0.98);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--as-border);
    }
    .as-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .as-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .as-brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--as-amber-bg); border: 1px solid rgba(243, 178, 62, 0.4);
      display: grid; place-items: center; color: var(--as-amber); flex-shrink: 0;
    }
    .as-brand-info h1 {
      font-size: 14px; font-weight: 800; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 150px;
    }
    .as-brand-info p {
      font-size: 11px; color: var(--as-mut); font-weight: 600;
      display: flex; align-items: center; gap: 5px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--as-teal); box-shadow: 0 0 8px var(--as-teal);
    }

    .as-header-actions { display: flex; align-items: center; gap: 6px; }
    
    .as-rate-pill {
      background: rgba(0,0,0,0.45); border: 1px solid var(--as-border);
      color: var(--as-amber); font-weight: 800; font-size: 12.5px;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .as-rate-pill:active { transform: scale(0.95); }

    .as-btn-icon-head {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--as-border);
      background: rgba(255, 255, 255, 0.05); color: var(--as-ink);
      display: grid; place-items: center; cursor: pointer;
    }
    .as-btn-icon-head:active { transform: scale(0.92); }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* CLIENTE ACTIVO */
    .as-client-bar {
      margin: 8px 0 6px; background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--as-border); border-radius: 10px;
      padding: 6px 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .as-client-bar-info { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
    .as-client-bar-info b { color: var(--as-amber); }
    .as-btn-mini-cli {
      background: var(--as-amber-bg); border: 1px solid rgba(243,178,62,0.4);
      color: var(--as-amber); font-size: 10.5px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; cursor: pointer;
    }

    /* BÚSQUEDA */
    .as-search-box { position: relative; margin: 6px 0 8px; }
    .as-search-input {
      width: 100%; background: rgba(0,0,0,0.35);
      border: 1px solid var(--as-border); border-radius: 10px;
      padding: 9px 36px; color: var(--as-ink); font-size: 13.5px; outline: none;
    }
    .as-search-input:focus { border-color: var(--as-amber); }
    .as-search-icon {
      position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%); color: var(--as-mut); width: 16px; height: 16px;
    }
    .as-search-clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--as-mut); font-size: 15px;
      cursor: pointer; display: none;
    }
    .as-search-clear.show { display: block; }

    /* CHIPS DE CATEGORÍAS */
    .as-chips-scroll {
      display: flex; gap: 6px; overflow-x: auto;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .as-chips-scroll::-webkit-scrollbar { display: none; }
    .as-chip {
      flex-shrink: 0; padding: 5px 12px; border-radius: 18px;
      background: var(--as-card); border: 1px solid var(--as-border);
      color: var(--as-ink-dim); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .as-chip.active {
      background: var(--as-amber); color: var(--as-amber-d);
      border-color: var(--as-amber);
    }

    /* ============================================================
       CATÁLOGO GRID
    ============================================================ */
    .as-catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px; padding: 12px 14px;
    }
    @media (min-width: 600px) { .as-catalog-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .as-catalog-grid { grid-template-columns: repeat(4, 1fr); max-width: 1200px; margin: 0 auto; } }

    /* ============================================================
       TARJETA 3D FLIP CARD
    ============================================================ */
    .flip-card {
      perspective: 1200px;
      height: 335px;
      cursor: pointer;
    }
    .flip-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.65s var(--ease-smooth);
    }
    .flip-card.is-flipped .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute; inset: 0; border-radius: 14px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: var(--as-card); border: 1px solid var(--as-border);
      box-shadow: var(--as-shadow); overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* --- FRENTE --- */
    .card-hero {
      position: relative; height: 145px; background: #000;
      display: block; overflow: hidden;
    }
    .card-hero img.prod-img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.3s ease;
    }
    .card-hero-placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: #0d2622;
    }
    .card-hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(7,21,19,0.92) 100%);
      pointer-events: none;
    }

    .card-category-tag {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      background: rgba(0,0,0,0.75); padding: 3px 8px; border-radius: 6px;
      font-size: 9.5px; font-weight: 800; color: #fff; text-transform: uppercase;
      backdrop-filter: blur(4px); max-width: 120px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .card-stock-highlight {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 900;
      letter-spacing: 0.3px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .card-stock-highlight.ok {
      background: linear-gradient(135deg, #10b981, #059669); color: #ffffff;
    }
    .card-stock-highlight.low {
      background: linear-gradient(135deg, #f59e0b, #d97706); color: #000000;
    }
    .card-stock-highlight.out {
      background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff;
    }

    .card-front-body {
      padding: 10px 12px; display: flex; flex-direction: column;
      justify-content: space-between; flex: 1;
    }
    .prod-name {
      font-size: 13.5px; font-weight: 800; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; min-height: 34px;
    }
    .prod-meta {
      font-size: 10.5px; color: var(--as-mut); font-weight: 600;
      display: flex; justify-content: space-between; margin-top: 4px;
    }
    .price-box {
      margin-top: auto; padding-top: 8px;
      border-top: 1px dashed var(--as-border);
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .price-usd { font-size: 18.5px; font-weight: 900; color: var(--as-amber); line-height: 1; }
    .price-bs { font-size: 11px; color: var(--as-teal); font-weight: 700; margin-top: 2px; }
    .flip-btn-hint {
      font-size: 9.5px; color: var(--as-mut); font-weight: 700;
      text-transform: uppercase; display: flex; align-items: center; gap: 3px;
    }

    /* --- DORSO --- */
    .flip-back {
      transform: rotateY(180deg);
      background: var(--as-card-strong);
      padding: 12px; display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .back-header {
      border-bottom: 1px solid var(--as-border);
      padding-bottom: 6px; margin-bottom: 8px;
    }
    .back-header h4 {
      font-size: 13px; font-weight: 800; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .back-header span { font-size: 10px; color: var(--as-mut); }
    .back-specs { display: grid; gap: 6px; font-size: 11.5px; flex: 1; }
    .spec-item { display: flex; justify-content: space-between; align-items: center; }
    .spec-item .lbl { color: var(--as-mut); font-weight: 700; text-transform: uppercase; font-size: 9.5px; }
    .spec-item .val { font-weight: 800; color: var(--as-ink); }

    .live-stock-pulse {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--as-teal); font-weight: 700;
    }

    .back-qty-selector {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; background: rgba(0,0,0,0.3); border-radius: 8px;
      padding: 5px; margin: 8px 0; border: 1px solid var(--as-border);
    }
    .back-qty-btn {
      width: 28px; height: 28px; border-radius: 6px; border: none;
      background: rgba(255,255,255,0.1); color: var(--as-ink);
      font-size: 16px; font-weight: 900; cursor: pointer;
    }
    .back-qty-num { font-size: 15px; font-weight: 800; min-width: 26px; text-align: center; }

    .back-actions { display: flex; gap: 6px; }
    .btn-add-cart {
      flex: 1; background: var(--as-amber); color: var(--as-amber-d);
      border: none; border-radius: 8px; padding: 10px; font-size: 12.5px;
      font-weight: 800; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 5px;
    }
    .btn-back-flip {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--as-border);
      color: var(--as-ink); display: grid; place-items: center; cursor: pointer;
    }

    /* ============================================================
       BOTÓN FLOTANTE (FAB)
    ============================================================ */
    .as-fab-cart {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      right: 18px; width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--as-teal) 0%, #1ea98a 100%);
      color: #04241d; border: none; display: grid; place-items: center;
      box-shadow: 0 8px 24px rgba(63,217,168,0.45); cursor: pointer;
      z-index: 100; transition: transform 0.2s var(--ease-spring);
    }
    .as-fab-cart:active { transform: scale(0.92); }
    .as-fab-badge {
      position: absolute; top: -3px; right: -3px;
      background: var(--as-amber); color: var(--as-amber-d);
      font-size: 11px; font-weight: 900; min-width: 20px; height: 20px;
      border-radius: 10px; display: grid; place-items: center;
      border: 2px solid var(--as-bg); padding: 0 4px;
      transform: scale(0); transition: transform 0.25s var(--ease-spring);
    }
    .as-fab-badge.show { transform: scale(1); }

    /* ============================================================
       MODALES & BOTTOM SHEET
    ============================================================ */
    .as-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.82);
      backdrop-filter: blur(8px); display: none; align-items: center;
      justify-content: center; z-index: 200; padding: 14px;
    }
    .as-modal-backdrop.open { display: flex; }

    .as-modal-box {
      background: var(--as-card-strong); border: 1px solid var(--as-border);
      border-radius: 16px; width: 100%; max-width: 440px; padding: 18px;
      box-shadow: var(--as-shadow); max-height: 90vh; overflow-y: auto;
    }

    .as-bottom-sheet {
      background: #0a1f1c; border: 1px solid var(--as-border);
      border-bottom: none; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 500px; max-height: 85vh;
      display: flex; flex-direction: column;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      position: fixed; bottom: 0;
    }

    .as-sheet-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .as-sheet-head h3 { font-size: 16px; font-weight: 800; }
    .as-cart-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 8px; margin-bottom: 12px; max-height: 40vh;
    }
    .as-cart-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.03); border: 1px solid var(--as-border);
      border-radius: 10px; padding: 8px 12px;
    }
    .as-cart-totals {
      border-top: 1px solid var(--as-border); padding-top: 10px;
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 14px;
    }
    .as-cart-total-usd { font-size: 22px; font-weight: 900; color: var(--as-amber); line-height: 1; }
    .as-cart-total-bs { font-size: 12px; color: var(--as-teal); font-weight: 700; margin-top: 2px; }

    .as-input-field {
      width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--as-border);
      border-radius: 10px; padding: 9px 12px; color: var(--as-ink);
      font-size: 13.5px; outline: none; margin: 4px 0 10px;
    }
    .as-input-field:focus { border-color: var(--as-amber); }

    .as-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 14px; border-radius: 10px; border: none; font-size: 13.5px;
      font-weight: 700; cursor: pointer; width: 100%;
    }
    .as-btn-amber { background: var(--as-amber); color: var(--as-amber-d); }
    .as-btn-ghost { background: rgba(255,255,255,0.06); color: var(--as-ink); border: 1px solid var(--as-border); }

    #asToast {
      position: fixed; top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%; transform: translateX(-50%) translateY(-10px);
      background: rgba(10, 32, 28, 0.98); border: 1px solid var(--as-teal);
      color: var(--as-ink); padding: 10px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 700; z-index: 300; opacity: 0;
      pointer-events: none; transition: all 0.25s; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    #asToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <header class="as-header">
    <div class="as-header-row">
      <div class="as-brand">
        <div class="as-brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"/></svg>
        </div>
        <div class="as-brand-info">
          <h1 id="vendorTitle">Catálogo Oficial</h1>
          <p><span class="live-dot" id="liveDot"></span> <span id="syncText">Cargando...</span></p>
        </div>
      </div>
      <div class="as-header-actions">
        <!-- PÍLDORA DE TASA -->
        <div class="as-rate-pill" data-act="ref-tasas" id="asTasaBtn" title="Tasa BCV (Clic para actualizar)">$ --</div>
        <button class="as-btn-icon-head" id="btnSyncManual" title="Sincronizar datos">
          <svg id="syncIconSvg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
        <button class="as-btn-icon-head" id="btnShareModal" title="Compartir enlace">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
    </div>

    <!-- CLIENTE SELECCIONADO -->
    <div class="as-client-bar">
      <div class="as-client-bar-info">
        <span>Cliente:</span>
        <b id="lblClienteActivo">CLIENTE GENÉRICO</b>
        <span id="lblClienteRif" style="color:var(--as-mut);font-size:10px;">(S/R)</span>
      </div>
      <button class="as-btn-mini-cli" id="btnModalCliente">+ Cambiar / Nuevo</button>
    </div>

    <!-- BÚSQUEDA -->
    <div class="as-search-box">
      <svg class="as-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="as-search-input" id="asSearch" placeholder="Buscar producto o código..." autocomplete="off">
      <button class="as-search-clear" id="asSearchClear">✕</button>
    </div>

    <!-- CHIPS DE CATEGORÍAS (100% DINÁMICOS) -->
    <div class="as-chips-scroll" id="asChipsCont">
      <button class="as-chip active" data-cat="all">Todos</button>
    </div>
  </header>

  <!-- CATÁLOGO GRID -->
  <main class="as-catalog-grid" id="catalogCont">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--as-mut);">
      Cargando catálogo...
    </div>
  </main>

  <!-- FAB CARRITO -->
  <button class="as-fab-cart" id="btnOpenCart" aria-label="Ver Pedido">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="as-fab-badge" id="cartBadgeCount">0</span>
  </button>

  <!-- BOTTOM SHEET DEL PEDIDO -->
  <div class="as-modal-backdrop" id="cartSheet">
    <div class="as-bottom-sheet">
      <div class="as-sheet-head">
        <h3>🛒 Mi Pedido</h3>
        <button style="background:none;border:none;color:var(--as-mut);font-size:22px;cursor:pointer;" id="btnCloseCart">✕</button>
      </div>
      <div class="as-cart-list" id="cartListItems"></div>
      <div class="as-cart-totals">
        <div>
          <span style="font-size:11px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">Total Estimado</span>
          <div class="as-cart-total-bs" id="cartTotalBs">Bs. 0,00</div>
        </div>
        <div class="as-cart-total-usd" id="cartTotalUSD">$0,00</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="as-btn as-btn-ghost" id="btnVaciarCarrito" style="flex:0.8;">Vaciar</button>
        <button class="as-btn as-btn-amber" id="btnSendWhatsApp" style="flex:1.6;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;">
          WhatsApp Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CLIENTE: SELECCIONAR O CREAR NUEVO -->
  <div class="as-modal-backdrop" id="modalCliente">
    <div class="as-modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h4 style="margin:0;color:var(--as-amber);font-size:15px;">Gestión de Cliente</h4>
        <button style="background:none;border:none;color:var(--as-mut);font-size:20px;cursor:pointer;" id="btnCloseModalCliente">✕</button>
      </div>

      <label style="font-size:10.5px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">Seleccionar Cliente Registrado</label>
      <select class="as-input-field" id="selClienteExistente">
        <option value="">CLIENTE GENÉRICO (S/R)</option>
      </select>

      <div style="text-align:center;margin:8px 0;color:var(--as-mut);font-size:11px;">— O REGISTRAR UNO NUEVO —</div>

      <label style="font-size:10.5px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">Nombre o Razón Social *</label>
      <input type="text" class="as-input-field" id="newCliNombre" placeholder="Ej: Abasto La Bendición">
      
      <label style="font-size:10.5px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">RIF / Cédula *</label>
      <input type="text" class="as-input-field" id="newCliRif" placeholder="Ej: J-12345678-0">
      
      <div style="display:flex;gap:8px;">
        <div style="flex:1;">
          <label style="font-size:10.5px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">Teléfono</label>
          <input type="text" class="as-input-field" id="newCliTel" placeholder="0414-0000000">
        </div>
        <div style="flex:1;">
          <label style="font-size:10.5px;color:var(--as-mut);text-transform:uppercase;font-weight:700;">Correo</label>
          <input type="email" class="as-input-field" id="newCliMail" placeholder="cliente@correo.com">
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="as-btn as-btn-ghost" id="btnAplicarGenerico" style="flex:1;">Usar Genérico</button>
        <button class="as-btn as-btn-amber" id="btnGuardarClienteNuevo" style="flex:1.4;">Guardar y Usar</button>
      </div>
    </div>
  </div>

  <div id="asToast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   MAPA DE CATEGORÍAS 100% DINÁMICO (DESDE RESUMEN!I44:J)
============================================================ */
var MAPA_CATEGORIAS = {};

var DB = {
  productos: [],
  clientes: [],
  clienteActivo: { id: '', nombre: 'CLIENTE GENÉRICO', rif: 'S/R', tel: '', mail: '' },
  tasaUSD: 1,
  idSpreadsheet: '',
  vendedor: 'Vendedor',
  telefono: ''
};

var CART = [];
var curCat = 'all';
var tempQty = {};

function $(id) { return document.getElementById(id); }
function fmt$(n) { return '$' + Number(n||0).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtBs(n) { return 'Bs. ' + Number(n||0).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function notify(msg) {
  var t = $('asToast');
  if (!t) return;
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* PROMISE GAS */
function gas(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    if (!(window.google && google.script && google.script.run)) {
      return reject(new Error('google.script.run no disponible'));
    }
    var done = false;
    var timer = setTimeout(function(){
      if (done) return;
      done = true;
      reject(new Error('Tiempo de espera agotado'));
    }, 25000);

    google.script.run
      .withSuccessHandler(function(res){
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(res);
      })
      .withFailureHandler(function(err){
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(err);
      })[fn].apply(null, args);
  });
}

function normalizarUrlImagen(url) {
  if (!url || typeof url !== 'string') return '';
  url = url.trim();
  if (url.includes('drive.google.com')) {
    var match = url.match(/[-\w]{25,}/);
    if (match) return 'https://lh3.googleusercontent.com/d/' + match[0];
  }
  return url;
}

/* RESOLUTORES DE ENTORNO */
function getIdEmpresaActiva() {
  try {
    var p = new URLSearchParams(window.location.search);
    var idUrl = p.get('id');
    if (idUrl && idUrl.trim().length > 15) return idUrl.trim();

    var e = JSON.parse(sessionStorage.getItem('empresaActiva') || localStorage.getItem('empresaActiva') || '{}');
    if (e.idSpreadsheet || e.id) return e.idSpreadsheet || e.id;

    var u = JSON.parse(sessionStorage.getItem('userData') || localStorage.getItem('userData') || '{}');
    if (u.idSpreadsheet || u.empresaId) return u.idSpreadsheet || u.empresaId;

    return '';
  } catch(err) { return ''; }
}

function getVendedorActual() {
  try {
    var p = new URLSearchParams(window.location.search);
    var vUrl = p.get('v');
    if (vUrl && vUrl.trim()) return vUrl.trim();

    var u = JSON.parse(sessionStorage.getItem('userData') || localStorage.getItem('userData') || '{}');
    return u.nombre || u.username || u.role || 'Vendedor';
  } catch(e) { return 'Vendedor'; }
}

function leerParametros() {
  DB.idSpreadsheet = getIdEmpresaActiva();
  DB.vendedor = getVendedorActual();

  var p = new URLSearchParams(window.location.search);
  DB.telefono = (p.get('t') || '').replace(/[^0-9]/g, '');

  if (DB.vendedor && $('vendorTitle')) {
    $('vendorTitle').innerText = DB.vendedor;
  }
}

/* ============================================================
   CONSULTA DE TASA MAESTRA (USA API COTIZAVE + RESPALDO)
============================================================ */
async function consultarTasaMaestraDirecta() {
  // 1. API en vivo Cotizave
  try {
    var resApi = await gas('obtenerTasaApiCotizave');
    if (resApi && Number(resApi.tasaUSD) > 0) {
      return Number(resApi.tasaUSD);
    }
  } catch(e) {}

  // 2. Archivo externo Tasas!C3
  try {
    var r1 = await gas('obtenerTasaCambioActual');
    if (r1 && Number(r1.tasaUSD) > 0) {
      return Number(r1.tasaUSD);
    }
  } catch(e) {}

  // 3. getTasasDeCambio()
  try {
    var r2 = await gas('getTasasDeCambio');
    if (r2 && Number(r2.tasaDolar) > 0) {
      return Number(r2.tasaDolar);
    }
  } catch(e) {}

  return 0;
}

/* ============================================================
   CARGA CENTRALIZADA DE DATOS
============================================================ */
async function cargarDatos(mostrarAnimacion) {
  var icon = $('syncIconSvg');
  if (icon && mostrarAnimacion) icon.classList.add('spin');
  $('syncText').innerText = 'Sincronizando...';

  try {
    // 1. Cargar Tasa Maestra
    var tasaMaestra = await consultarTasaMaestraDirecta();
    if (tasaMaestra > 0) {
      DB.tasaUSD = tasaMaestra;
      var btnT = $('asTasaBtn');
      if (btnT) btnT.innerText = '$ ' + DB.tasaUSD.toFixed(2);
    }

    // 2. Cargar Mapa de Categorías 100% DINÁMICO desde Resumen!I44:J
    try {
      var mapaServidor = await gas('obtenerCategoriasResumen', DB.idSpreadsheet);
      if (mapaServidor && typeof mapaServidor === 'object') {
        MAPA_CATEGORIAS = mapaServidor;
      }
    } catch(e) {
      console.warn('No se pudo cargar mapa dinámico de categorías:', e);
    }

    // 3. Sincronización general (syncTodo)
    var r = await gas('syncTodo', DB.vendedor, DB.idSpreadsheet);

    if (r && r.status === 'success') {
      if (DB.tasaUSD <= 1 && Number(r.tasaUSD || r.tasa) > 0) {
        DB.tasaUSD = Number(r.tasaUSD || r.tasa);
        var btnT2 = $('asTasaBtn');
        if (btnT2) btnT2.innerText = '$ ' + DB.tasaUSD.toFixed(2);
      }

      var rawCli = r.clientesFull || r.clientesBasicos || [];
      DB.clientes = rawCli.map(function(c){
        return {
          id: c.id || '',
          nombre: c.nombre || c.NombreClientes || 'Cliente',
          rif: c.rif || c.RifClientes || 'S/R',
          tel: c.tel || c.TelefonoCliente || '',
          mail: c.mail || c.CorreoCliente || ''
        };
      });
      poblarSelectClientes();
    }

    // 4. Cargar Productos
    var rawProd = await gas('obtenerProductos', DB.idSpreadsheet);
    if (!Array.isArray(rawProd) && r && Array.isArray(r.productos)) {
      rawProd = r.productos;
    }

    if (Array.isArray(rawProd)) {
      DB.productos = rawProd.filter(function(p){
        var id = String(p.IdProducto || p.id || '').trim().toUpperCase();
        var st = String(p.Status || p.status || 'Activo').trim().toLowerCase();
        return !id.startsWith('G') && !id.startsWith('S') && st !== 'inactivo';
      }).map(function(p){
        var rawCat = String(p.CategoriaProducto || p.categoria || '').trim();
        // Traducción dinámica: si existe en Resumen!I44:J usa el nombre, sino usa el código
        var catDesc = (MAPA_CATEGORIAS && MAPA_CATEGORIAS[rawCat]) ? MAPA_CATEGORIAS[rawCat] : (rawCat || 'General');
        var imgUrl = normalizarUrlImagen(p.ImagenProducto || p.imagen || p.Imagen || '');

        return {
          id: String(p.IdProducto || p.id || '').trim(),
          nombre: String(p.NombreProducto || p.nombre || 'Sin Nombre').trim(),
          precioUSD: Number(p.precioVenta) || Number(p.PrecioProducto) || Number(p.precio) || 0,
          stock: Number(p.StockProducto !== undefined ? p.StockProducto : p.stock) || 0,
          minimo: Number(p.MinimoProducto !== undefined ? p.MinimoProducto : p.minimo) || 5,
          iva: Number(p.IvaProducto !== undefined ? p.IvaProducto : p.iva) || 0,
          categoriaId: rawCat,
          categoria: catDesc,
          imagen: imgUrl,
          medida: String(p.Medida || p.medida || 'UNID').trim(),
          unidad: String(p.UnidadMedida || p.unidadMedida || 'UNID').trim(),
          compuesto: String(p.tipo || '').toLowerCase() === 'compuesto'
        };
      });

      $('syncText').innerText = 'En línea · ' + DB.productos.length + ' productos';
      renderChips();
      renderCatalogo();
    }

    if (icon) icon.classList.remove('spin');
  } catch(e) {
    console.error('Error al sincronizar:', e);
    if (icon) icon.classList.remove('spin');
    $('syncText').innerText = 'Error de conexión';
    notify('Error sincronizando datos');
  }
}

/* ============================================================
   RENDER DE CHIPS DINÁMICOS
============================================================ */
function renderChips() {
  var cats = ['all'];
  DB.productos.forEach(function(p){
    if (p.categoria && !cats.includes(p.categoria)) cats.push(p.categoria);
  });

  $('asChipsCont').innerHTML = cats.map(function(c){
    var isAct = (c === curCat);
    var label = (c === 'all') ? 'Todos' : c;
    return '<button class="as-chip ' + (isAct ? 'active' : '') + '" data-cat="' + c + '">' + label + '</button>';
  }).join('');
}

/* ============================================================
   RENDER GRID CON STOCK E IMÁGENES
============================================================ */
function renderCatalogo() {
  var q = $('asSearch').value.toLowerCase().trim();
  var cont = $('catalogCont');

  var list = DB.productos.filter(function(p){
    var matchCat = (curCat === 'all' || p.categoria === curCat);
    var matchQ = !q || p.nombre.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  if (!list.length) {
    cont.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--as-mut);">No hay productos en esta categoría</div>';
    return;
  }

  cont.innerHTML = list.map(function(p){
    var stockCls = p.stock > p.minimo ? 'ok' : (p.stock > 0 ? 'low' : 'out');
    var stockTxt = p.stock > 0 ? ('STOCK: ' + p.stock + ' ' + p.unidad) : 'AGOTADO';
    var tieneImg = p.imagen && p.imagen.length > 5;
    var qActual = tempQty[p.id] || 1;

    return '' +
    '<div class="flip-card" data-id="' + p.id + '">' +
      '<div class="flip-inner">' +

        '<!-- FRENTE -->' +
        '<div class="flip-face">' +
          '<div class="card-hero">' +
            (tieneImg ? 
              '<img src="' + p.imagen + '" alt="' + p.nombre + '" loading="lazy" class="prod-img" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'grid\';">' : ''
            ) +
            '<div class="card-hero-placeholder" style="display:' + (tieneImg ? 'none' : 'grid') + ';">' +
              '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>' +
            '</div>' +
            
            '<span class="card-category-tag">' + p.categoria + (p.compuesto ? ' · COMBO' : '') + '</span>' +
            
            '<div class="card-stock-highlight ' + stockCls + '" id="stock-badge-' + p.id + '">' +
              stockTxt +
            '</div>' +
          '</div>' +

          '<div class="card-front-body">' +
            '<div class="prod-name">' + p.nombre + '</div>' +
            '<div class="prod-meta">' +
              '<span>' + p.medida + ' / ' + p.unidad + '</span>' +
              '<span>COD: ' + p.id + '</span>' +
            '</div>' +
            '<div class="price-box">' +
              '<div>' +
                '<div class="price-usd">' + fmt$(p.precioUSD) + '</div>' +
                '<div class="price-bs">≈ ' + fmtBs(p.precioUSD * DB.tasaUSD) + '</div>' +
              '</div>' +
              '<div class="flip-btn-hint">Detalles ↻</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<!-- DORSO -->' +
        '<div class="flip-face flip-back">' +
          '<div class="back-header">' +
            '<h4>' + p.nombre + '</h4>' +
            '<span>' + p.categoria + ' · ' + p.id + '</span>' +
          '</div>' +
          '<div class="back-specs">' +
            '<div class="spec-item"><span class="lbl">Precio USD</span><span class="val" style="color:var(--as-amber);">' + fmt$(p.precioUSD) + '</span></div>' +
            '<div class="spec-item"><span class="lbl">Precio Bs</span><span class="val" style="color:var(--as-teal);">' + fmtBs(p.precioUSD * DB.tasaUSD) + '</span></div>' +
            '<div class="spec-item">' +
              '<span class="lbl">Stock Actual</span>' +
              '<span class="val" id="back-stock-' + p.id + '">' + p.stock + ' ' + p.unidad + '</span>' +
            '</div>' +
            '<div class="spec-item"><span class="lbl">Régimen</span><span class="val">' + (p.iva > 0 ? p.iva + '% IVA' : 'Exento') + '</span></div>' +
            '<div class="spec-item" style="margin-top:2px;">' +
              '<span class="live-stock-pulse" id="pulse-live-' + p.id + '">● Stock verificado</span>' +
            '</div>' +
          '</div>' +

          '<div class="back-qty-selector">' +
            '<button class="back-qty-btn" data-act="dec-qty" data-id="' + p.id + '">−</button>' +
            '<span class="back-qty-num" id="qty-val-' + p.id + '">' + qActual + '</span>' +
            '<button class="back-qty-btn" data-act="inc-qty" data-id="' + p.id + '">+</button>' +
          '</div>' +

          '<div class="back-actions">' +
            '<button class="btn-add-cart" data-act="add-to-cart" data-id="' + p.id + '">' +
              '🛒 Agregar' +
            '</button>' +
            '<button class="btn-back-flip" data-act="flip-back" title="Volver">' +
              '↻' +
            '</button>' +
          '</div>' +
        '</div>' +

      '</div>' +
    '</div>';
  }).join('');
}

/* ============================================================
   ACTUALIZACIÓN EN VIVO DE STOCK AL TOCAR LA TARJETA
============================================================ */
async function actualizarStockEnVivo(idProducto) {
  try {
    var p = DB.productos.find(function(x){ return x.id === idProducto; });
    if (!p) return;

    var pulse = $('pulse-live-' + idProducto);
    if (pulse) pulse.innerText = '○ Verificando stock...';

    var res = await gas('verificarProducto', p.id);
    if (res && res.encontrado) {
      p.stock = Number(res.stock) || 0;

      var bStock = $('back-stock-' + p.id);
      if (bStock) bStock.innerText = p.stock + ' ' + p.unidad;

      var fBadge = $('stock-badge-' + p.id);
      if (fBadge) {
        var stockCls = p.stock > p.minimo ? 'ok' : (p.stock > 0 ? 'low' : 'out');
        fBadge.className = 'card-stock-highlight ' + stockCls;
        fBadge.innerText = p.stock > 0 ? ('STOCK: ' + p.stock + ' ' + p.unidad) : 'AGOTADO';
      }

      if (pulse) pulse.innerText = '● Stock al día';
    }
  } catch(e) {
    console.warn('No se pudo verificar stock en vivo:', e);
  }
}

/* ============================================================
   CLIENTES (GENÉRICO Y NUEVO)
============================================================ */
function poblarSelectClientes() {
  var sel = $('selClienteExistente');
  if (!sel) return;
  sel.innerHTML = '<option value="">CLIENTE GENÉRICO (S/R)</option>' +
    DB.clientes.map(function(c){
      return '<option value="' + c.id + '">' + c.nombre + ' (' + c.rif + ')</option>';
    }).join('');
}

function abrirModalCliente() { $('modalCliente').classList.add('open'); }
function cerrarModalCliente() { $('modalCliente').classList.remove('open'); }

function usarClienteGenerico() {
  DB.clienteActivo = { id: '', nombre: 'CLIENTE GENÉRICO', rif: 'S/R', tel: '', mail: '' };
  $('lblClienteActivo').innerText = DB.clienteActivo.nombre;
  $('lblClienteRif').innerText = '(S/R)';
  cerrarModalCliente();
  notify('Asignado: CLIENTE GENÉRICO');
}

async function guardarYUsarClienteNuevo() {
  var nom = $('newCliNombre').value.trim();
  var rif = $('newCliRif').value.trim();
  var tel = $('newCliTel').value.trim();
  var mail = $('newCliMail').value.trim();

  if (!nom || !rif) {
    notify('Nombre y RIF son obligatorios');
    return;
  }

  notify('Registrando cliente...');

  try {
    await gas('guardarCliente', {
      idSpreadsheet: DB.idSpreadsheet,
      NombreClientes: nom,
      RifClientes: rif,
      TelefonoCliente: tel,
      CorreoCliente: mail,
      Vendedor: DB.vendedor
    });

    DB.clienteActivo = { id: '', nombre: nom, rif: rif, tel: tel, mail: mail };
    $('lblClienteActivo').innerText = nom;
    $('lblClienteRif').innerText = '(' + rif + ')';

    $('newCliNombre').value = '';
    $('newCliRif').value = '';
    $('newCliTel').value = '';
    $('newCliMail').value = '';

    cerrarModalCliente();
    notify('✓ Cliente registrado');
  } catch(e) {
    notify('Error: ' + e.message);
  }
}

/* ============================================================
   CARRITO Y WHATSAPP
============================================================ */
function agregarAlCarrito(id) {
  var p = DB.productos.find(function(x){ return x.id === id; });
  if (!p) return;
  if (p.stock <= 0) {
    notify('Producto agotado');
    return;
  }

  var cant = tempQty[id] || 1;
  var item = CART.find(function(x){ return x.id === id; });

  if (item) {
    if (item.cantidad + cant > p.stock) {
      notify('Stock máximo alcanzado (' + p.stock + ')');
      return;
    }
    item.cantidad += cant;
  } else {
    CART.push({ id: p.id, nombre: p.nombre, precio: p.precioUSD, cantidad: cant });
  }

  tempQty[id] = 1;
  var elQ = $('qty-val-' + id); if (elQ) elQ.innerText = '1';

  actualizarBadgeCarrito();
  notify('✓ ' + p.nombre + ' agregado');
}

function actualizarBadgeCarrito() {
  var tot = CART.reduce(function(a,b){ return a + b.cantidad; }, 0);
  var badge = $('cartBadgeCount');
  if (badge) {
    badge.innerText = tot;
    badge.classList.toggle('show', tot > 0);
  }
}

function renderCarritoSheet() {
  var list = $('cartListItems');
  if (!CART.length) {
    list.innerHTML = '<div style="text-align:center;padding:25px;color:var(--as-mut);">Tu carrito está vacío</div>';
    $('cartTotalUSD').innerText = '$0,00';
    $('cartTotalBs').innerText = 'Bs. 0,00';
    return;
  }

  var totalUSD = 0;
  list.innerHTML = CART.map(function(item){
    var st = item.precio * item.cantidad;
    totalUSD += st;
    return '' +
    '<div class="as-cart-item">' +
      '<div>' +
        '<b style="font-size:13px;">' + item.nombre + '</b>' +
        '<div style="font-size:11px;color:var(--as-mut);">' + item.cantidad + ' × ' + fmt$(item.precio) + ' = <b style="color:var(--as-teal);">' + fmt$(st) + '</b></div>' +
      '</div>' +
      '<button data-act="del-cart-item" data-id="' + item.id + '" style="background:none;border:none;color:var(--as-red);font-size:16px;cursor:pointer;">✕</button>' +
    '</div>';
  }).join('');

  $('cartTotalUSD').innerText = fmt$(totalUSD);
  $('cartTotalBs').innerText = fmtBs(totalUSD * DB.tasaUSD);
}

function enviarWhatsAppPedido() {
  if (!CART.length) { notify('El carrito está vacío'); return; }

  var totalUSD = CART.reduce(function(a,b){ return a + (b.precio * b.cantidad); }, 0);
  var totalBs = totalUSD * DB.tasaUSD;

  var msg = '🛍️ *NUEVO PEDIDO DE PRODUCTOS*\n';
  msg += 'Atendido por: *' + DB.vendedor + '*\n';
  msg += 'Cliente: *' + DB.clienteActivo.nombre + '* (' + DB.clienteActivo.rif + ')\n';
  if (DB.clienteActivo.tel) msg += 'Tel: ' + DB.clienteActivo.tel + '\n';
  msg += 'Fecha: ' + new Date().toLocaleDateString('es-VE') + '\n';
  msg += '─────────────────────\n';

  CART.forEach(function(i, idx){
    msg += (idx + 1) + '. *' + i.nombre + '*\n';
    msg += '   • Cant: ' + i.cantidad + ' x ' + fmt$(i.precio) + ' = ' + fmt$(i.cantidad * i.precio) + '\n';
  });

  msg += '─────────────────────\n';
  msg += '*TOTAL USD:* ' + fmt$(totalUSD) + '\n';
  msg += '*TOTAL Bs:* ' + fmtBs(totalBs) + '\n';
  msg += 'Tasa BCV: ' + DB.tasaUSD.toFixed(2) + ' Bs/$\n\n';
  msg += 'Notas / Dirección de entrega:\n';

  var waUrl = DB.telefono ?
    'https://wa.me/' + DB.telefono + '?text=' + encodeURIComponent(msg) :
    'https://wa.me/?text=' + encodeURIComponent(msg);

  window.open(waUrl, '_blank');
}

/* ============================================================
   EVENTOS
============================================================ */
function bindEvents() {
  $('asTasaBtn').addEventListener('click', function(){ cargarDatos(true); });
  $('btnSyncManual').addEventListener('click', function(){ cargarDatos(true); });

  $('asChipsCont').addEventListener('click', function(e){
    var c = e.target.closest('.as-chip');
    if (!c) return;
    curCat = c.dataset.cat;
    document.querySelectorAll('.as-chip').forEach(function(x){ x.classList.toggle('active', x === c); });
    renderCatalogo();
  });

  var sInp = $('asSearch'), sClr = $('asSearchClear');
  sInp.addEventListener('input', function(){
    sClr.classList.toggle('show', sInp.value.length > 0);
    renderCatalogo();
  });
  sClr.addEventListener('click', function(){
    sInp.value = '';
    sClr.classList.remove('show');
    renderCatalogo();
  });

  $('catalogCont').addEventListener('click', function(e){
    var card = e.target.closest('.flip-card');
    if (!card) return;
    var id = card.dataset.id;

    var btnInc = e.target.closest('[data-act="inc-qty"]');
    if (btnInc) {
      e.stopPropagation();
      var p = DB.productos.find(function(x){ return x.id === id; });
      var q = tempQty[id] || 1;
      if (p && q < p.stock) q++;
      tempQty[id] = q;
      $('qty-val-' + id).innerText = q;
      return;
    }

    var btnDec = e.target.closest('[data-act="dec-qty"]');
    if (btnDec) {
      e.stopPropagation();
      var qDec = tempQty[id] || 1;
      if (qDec > 1) qDec--;
      tempQty[id] = qDec;
      $('qty-val-' + id).innerText = qDec;
      return;
    }

    var btnAdd = e.target.closest('[data-act="add-to-cart"]');
    if (btnAdd) {
      e.stopPropagation();
      agregarAlCarrito(id);
      card.classList.remove('is-flipped');
      return;
    }

    var btnBack = e.target.closest('[data-act="flip-back"]');
    if (btnBack) {
      e.stopPropagation();
      card.classList.remove('is-flipped');
      return;
    }

    card.classList.toggle('is-flipped');
    if (card.classList.contains('is-flipped')) {
      actualizarStockEnVivo(id);
    }
  });

  $('btnOpenCart').addEventListener('click', function(){
    renderCarritoSheet();
    $('cartSheet').classList.add('open');
  });
  $('btnCloseCart').addEventListener('click', function(){ $('cartSheet').classList.remove('open'); });
  $('btnVaciarCarrito').addEventListener('click', function(){
    CART = [];
    actualizarBadgeCarrito();
    renderCarritoSheet();
  });
  $('btnSendWhatsApp').addEventListener('click', enviarWhatsAppPedido);

  $('cartListItems').addEventListener('click', function(e){
    var b = e.target.closest('[data-act="del-cart-item"]');
    if (!b) return;
    CART = CART.filter(function(x){ return x.id !== b.dataset.id; });
    actualizarBadgeCarrito();
    renderCarritoSheet();
  });

  $('btnModalCliente').addEventListener('click', abrirModalCliente);
  $('btnCloseModalCliente').addEventListener('click', cerrarModalCliente);
  $('btnAplicarGenerico').addEventListener('click', usarClienteGenerico);
  $('btnGuardarClienteNuevo').addEventListener('click', guardarYUsarClienteNuevo);

  $('selClienteExistente').addEventListener('change', function(){
    var idSel = this.value;
    if (!idSel) {
      usarClienteGenerico();
      return;
    }
    var c = DB.clientes.find(function(x){ return String(x.id) === String(idSel); });
    if (c) {
      DB.clienteActivo = c;
      $('lblClienteActivo').innerText = c.nombre;
      $('lblClienteRif').innerText = '(' + c.rif + ')';
      cerrarModalCliente();
      notify('Asignado: ' + c.nombre);
    }
  });

  $('btnShareModal').addEventListener('click', function(){
    var u = window.location.href;
    if (navigator.share) {
      navigator.share({ title: 'Catálogo ' + DB.vendedor, url: u });
    } else {
      navigator.clipboard.writeText(u);
      notify('Enlace copiado al portapapeles');
    }
  });
}

function init() {
  leerParametros();
  bindEvents();
  cargarDatos(true);
}

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);

})();
</script>

</body>
</html>
