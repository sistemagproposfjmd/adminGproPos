<style>
/* ============================================================
   1. VARIABLES GLOBALES (un solo :root, sin duplicados)
   ============================================================ */
:root {
  /* Paleta base */
  --bg-card: rgba(15,23,42,0.92);
  --bg-input: rgba(30,41,59,0.85);
  --bg-secondary: rgba(15,17,21,0.8);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border-color: rgba(255,255,255,0.1);
  --accent-primary: #f97316;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5);
  --brand-orange: #ff6b35;
  --glass-border: rgba(255,255,255,0.08);
  --sidebar-width: 230px;
  --sidebar-collapsed-width: 60px;

  /* Glassmorphism blue */
  --glass-blue-50:  rgba(59,130,246,0.05);
  --glass-blue-100: rgba(59,130,246,0.08);
  --glass-blue-200: rgba(59,130,246,0.12);
  --glass-blue-300: rgba(59,130,246,0.18);
  --glass-blue-400: rgba(96,165,250,0.25);
  --glass-blue-border: rgba(96,165,250,0.22);
  --glass-blue-glow: rgba(59,130,246,0.35);
  --glass-blue-deep: rgba(8,47,73,0.85);
  --blur-md: 16px;
  --blur-lg: 20px;
  --blur-xl: 24px;

  /* Texto del toast */
  --text-main: #f8fafc;
  --primary: #f97316;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;

  /* DASHBOARD */
  --d-bg:#0a192f;--d-bg-2:#0d2142;--d-card:rgba(13,30,60,0.62);--d-card-solid:#0f1d3a;
  --d-card-border:rgba(96,165,250,0.14);--d-card-border-h:rgba(96,165,250,0.32);
  --d-glass:rgba(13,30,60,0.55);--d-card-glow:rgba(59,130,246,0.08);--d-card-inner:rgba(96,165,250,0.04);
  --d-card-inner-h:rgba(96,165,250,0.08);--d-card-ring:rgba(96,165,250,0.12);
  --d-text:#f6f7f9;--d-text-sub:#a1a8b3;--d-text-mute:#6c7280;
  --d-line:rgba(255,255,255,0.05);--d-line-strong:rgba(255,255,255,0.10);
  --d-orange:#ff7a3d;--d-orange-2:#F97316;--d-orange-3:#FB923C;--d-orange-100:rgba(249,115,22,0.14);
  --d-orange-50:rgba(249,115,22,0.06);--d-orange-glow:rgba(249,115,22,0.35);
  --d-blue:#3b82f6;--d-blue-2:#60A5FA;--d-blue-100:rgba(59,130,246,0.14);
  --d-emerald:#10b981;--d-emerald-2:#34D399;--d-emerald-100:rgba(16,185,129,0.14);
  --d-rose:#f43f5e;--d-rose-2:#fb7185;--d-rose-100:rgba(244,63,94,0.14);
  --d-purple:#a78bfa;--d-purple-2:#c4b5fd;--d-purple-100:rgba(167,139,250,0.14);
  --d-shadow:0 1px 2px rgba(0,0,0,0.25),0 8px 24px -12px rgba(0,0,0,0.45);
  --d-shadow-hover:0 2px 4px rgba(0,0,0,0.30),0 18px 40px -16px rgba(0,0,0,0.55);
  --d-shadow-pop:0 12px 32px -10px rgba(0,0,0,0.55),0 4px 10px -2px rgba(0,0,0,0.35);
  --d-glow-orange:0 0 0 1px rgba(249,115,22,0.20),0 8px 28px -8px rgba(249,115,22,0.35);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
}

[data-bs-theme="light"] {
  --text-primary:#111827;
  --text-secondary:#4b5563;
  --text-muted:#6b7280;
  --glass-border:rgba(0,0,0,0.1);
  --bg-card:rgba(255,255,255,0.65);
  --bg-secondary:rgba(243,244,246,0.9);

  /* DASHBOARD LIGHT */
  --d-bg:#f5f8fd;--d-bg-2:#ffffff;--d-card:#ffffff;--d-card-solid:#ffffff;
  --d-card-border:rgba(59,130,246,0.30);--d-card-border-h:rgba(37,99,235,0.55);
  --d-glass:rgba(255,255,255,0.92);--d-card-glow:rgba(59,130,246,0.10);
  --d-card-inner:rgba(59,130,246,0.10);--d-card-inner-h:rgba(37,99,235,0.18);
  --d-card-ring:rgba(37,99,235,0.30);
  --d-text:#0a1b2e;--d-text-sub:#4d5f76;--d-text-mute:#8b99aa;
  --d-line:#e2e8f5;--d-line-strong:#c7d3ee;
  --d-orange:#EA580C;--d-orange-2:#F97316;--d-orange-3:#FB923C;--d-orange-100:#FDEBDC;
  --d-orange-50:#FFF4EA;--d-orange-glow:rgba(234,88,12,0.18);
  --d-blue:#1A5B96;--d-blue-2:#2E77B8;--d-blue-100:#E9F2FB;
  --d-emerald:#059669;--d-emerald-2:#10b981;--d-emerald-100:#D1FAE5;
  --d-rose:#DC2626;--d-rose-2:#f87171;--d-rose-100:#FEE2E2;
  --d-purple:#7C3AED;--d-purple-2:#a78bfa;--d-purple-100:#EDE9FE;
  --d-shadow:0 1px 2px rgba(13,42,74,.04),0 8px 24px -14px rgba(13,42,74,.14);
  --d-shadow-hover:0 2px 4px rgba(13,42,74,.06),0 18px 40px -16px rgba(13,42,74,.22);
  --d-shadow-pop:0 12px 32px -10px rgba(13,42,74,.18),0 4px 10px -2px rgba(13,42,74,.08);
  --d-glow-orange:0 0 0 1px rgba(234,88,12,0.18),0 8px 28px -8px rgba(234,88,12,0.22);
}

/* ============================================================
   2. RESET + BODY (una sola definición)
   ============================================================ */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html {
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  height:100%;
  width:100%;
  margin:0;
  padding:0;
}
body {
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  font-family:'Poppins',sans-serif;
  color:var(--text-primary);
  transition:background .3s ease;
  position:relative;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(37,99,235,0.15), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(14,165,233,0.12), transparent 55%),
    #070e1e;
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(180deg, rgba(8,47,73,0.30), transparent 30%),
    linear-gradient(0deg, rgba(30,58,138,0.20), transparent 40%);
  pointer-events:none;
  z-index:0;
}
[data-bs-theme="light"] body {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.10), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(14,165,233,0.08), transparent 55%),
    #f3f4f6;
}

/* ============================================================
   3. ORBS decorativos
   ============================================================ */
.orb { position:fixed; border-radius:50%; filter:blur(80px); opacity:.3; z-index:0; pointer-events:none; }
.orb-1 { width:400px; height:400px; top:-100px; right:-100px; background:rgba(59,130,246,0.25); }
.orb-2 { width:300px; height:300px; bottom:-50px; left:-50px; background:rgba(96,165,250,0.30); opacity:.45; }
.orb-3 { width:200px; height:200px; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(37,99,235,0.20); opacity:.40; }

/* ============================================================
   4. BACKDROP DROPDOWN (una sola definición)
   ============================================================ */
#dropdownBackdrop {
  position:fixed;
  inset:0;
  top:0; left:0;
  width:100vw;
  height:100vh;
  background:rgba(8,47,73,0.55);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:99990;
  display:none;
}
#dropdownBackdrop.active { display:block; }

/* ============================================================
   5. MENÚES MODALES VERTICALES (Perfil + Notificaciones)
   ============================================================ */
#menuNotificacionesDropdown,
#userDropdownMenu {
  position:fixed;
  z-index:100060;
  background:linear-gradient(135deg, rgba(15,23,42,0.88), rgba(30,58,138,0.55));
  backdrop-filter:blur(var(--blur-xl)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur-xl)) saturate(160%);
  border:1px solid var(--glass-blue-border);
  box-shadow:-8px 0 40px -8px rgba(0,0,0,0.60), 0 0 0 1px rgba(96,165,250,0.10);
  border-radius:20px;
  overflow:hidden;
  display:none;
  flex-direction:column;
  box-sizing:border-box;
  padding:0;
}
#menuNotificacionesDropdown.show,
#userDropdownMenu.show {
  display:flex;
  flex-direction:column;
}
@media (max-width:768px) {
  #menuNotificacionesDropdown,
  #userDropdownMenu {
    top:50% !important; left:50% !important;
    right:auto !important; bottom:auto !important;
    transform:translate(-50%,-50%) !important;
    width:min(90vw,360px) !important;
    max-height:85vh !important;
  }
}
@media (min-width:769px) {
  #menuNotificacionesDropdown {
    top:65px !important; right:60px !important;
    left:auto !important; bottom:auto !important;
    width:380px !important; max-height:520px !important;
  }
  #userDropdownMenu {
    top:65px !important; right:20px !important;
    left:auto !important; bottom:auto !important;
    width:300px !important;
  }
}

.modal-vertical-header {
  width:100%;
  padding:14px 18px;
  display:flex;
  flex-direction:row;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--glass-blue-border);
  background:rgba(59,130,246,0.10);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  flex-shrink:0;
}
.modal-vertical-header h6 { margin:0; font-size:0.95rem; font-weight:700; color:#fff; }
.btn-close-modal {
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  color:#94a3b8;
  width:32px; height:32px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-size:1.2rem; line-height:1;
}
.btn-close-modal:hover { background:rgba(255,255,255,0.2); color:#fff; }

.notif-modal-card {
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(59,130,246,0.08);
  border:1px solid rgba(96,165,250,0.20);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  cursor:pointer;
  min-height:50px;
}
.notif-modal-card:hover {
  background:rgba(59,130,246,0.18);
  border-color:rgba(147,197,253,0.50);
  transform:translateX(4px);
  box-shadow:-4px 0 16px rgba(59,130,246,0.35);
}
.notif-modal-icon {
  width:40px; height:40px;
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem;
  flex-shrink:0;
}
.notif-modal-content { flex:1; min-width:0; }
.notif-modal-title {
  font-size:0.88rem; font-weight:600; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.notif-modal-subtitle {
  font-size:0.76rem; color:#94a3b8;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.notif-modal-badge {
  background:rgba(239,68,68,0.2);
  color:#ef4444;
  font-weight:700; font-size:0.8rem;
  padding:4px 10px;
  border-radius:8px;
  border:1px solid rgba(239,68,68,0.4);
  flex-shrink:0;
}

/* ============================================================
   6. DROPDOWN BOOTSTRAP DE NOTIFICACIONES
   ============================================================ */
.notifications-dropdown {
  width:360px !important;
  max-width:92vw !important;
  padding:0 !important;
  overflow:hidden;
  border-radius:18px !important;
  box-shadow:0 20px 45px rgba(0,0,0,0.5) !important;
}
.notifications-header {
  padding:12px 18px;
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid var(--glass-border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.notifications-header h6 {
  margin:0; font-size:0.9rem; font-weight:700;
  color:var(--text-primary);
  display:flex; align-items:center; gap:8px;
}
.notifications-body {
  max-height:400px;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.notif-card {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  background:rgba(59,130,246,0.08);
  border:1px solid rgba(96,165,250,0.20);
  border-radius:12px;
  cursor:pointer;
  transition:all 0.25s ease;
  text-decoration:none;
}
.notif-card:hover {
  background:rgba(59,130,246,0.18);
  border-color:rgba(147,197,253,0.50);
  transform:translateY(-2px);
}
.notif-icon {
  width:36px; height:36px;
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem;
  flex-shrink:0;
}
.notif-icon.warn-red    { background:rgba(239,68,68,0.15);    color:#ef4444; }
.notif-icon.warn-orange { background:rgba(245,158,11,0.15);  color:#f59e0b; }
.notif-icon.warn-amber  { background:rgba(234,179,8,0.15);    color:#eab308; }
.notif-icon.warn-blue   { background:rgba(59,130,246,0.15);   color:#3b82f6; }
.notif-content { flex:1; min-width:0; }
.notif-title {
  font-size:0.83rem; font-weight:600;
  color:var(--text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-bottom:2px;
}
.notif-subtitle {
  font-size:0.72rem; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.notif-badge {
  background:#ef4444; color:#fff;
  font-size:0.75rem; font-weight:700;
  padding:3px 9px;
  border-radius:20px;
  flex-shrink:0;
}
.notif-empty-state {
  padding:30px 20px;
  text-align:center;
  color:var(--text-muted);
}
.notif-empty-state i {
  font-size:2.2rem;
  color:#10b981;
  margin-bottom:10px;
}
.bell-active-red {
  color:#ef4444 !important;
  filter:drop-shadow(0 0 6px rgba(239,68,68,0.6));
}
.badge-bell-danger {
  background:#ef4444 !important;
  animation:bellPulse 1.8s infinite;
}
@keyframes bellPulse {
  0%   { transform:scale(1); box-shadow:0 0 0 0 rgba(239,68,68,0.7); }
  70%  { transform:scale(1.1); box-shadow:0 0 0 6px rgba(239,68,68,0); }
  100% { transform:scale(1); box-shadow:0 0 0 0 rgba(239,68,68,0); }
}

/* ============================================================
   7. LOGIN
   ============================================================ */
.login-wrapper {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  z-index:1;
  background:
    radial-gradient(circle at 30% 30%, rgba(37,99,235,0.20), transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(14,165,233,0.18), transparent 55%),
    linear-gradient(135deg, rgba(8,47,73,0.80), rgba(15,23,42,0.92));
  backdrop-filter:blur(var(--blur-lg)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur-lg)) saturate(150%);
}
.login-split {
  display:flex;
  max-width:1100px;
  width:100%;
  background:var(--glass-blue-100);
  border:1px solid var(--glass-blue-border);
  border-radius:32px;
  overflow:hidden;
  box-shadow:
    0 25px 80px rgba(0,0,0,0.55),
    0 0 0 1px rgba(96,165,250,0.08),
    inset 0 1px 0 rgba(255,255,255,0.10);
  backdrop-filter:blur(var(--blur-xl)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur-xl)) saturate(160%);
}
.login-brand-side {
  flex:1;
  padding:50px 40px;
  background:linear-gradient(160deg, rgba(30,64,175,0.40), rgba(15,23,42,0.60));
  border-right:1px solid var(--glass-blue-border);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.login-brand-side::before {
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 30% 30%, rgba(96,165,250,0.25), transparent 60%);
  pointer-events:none;
}
.brand-logo {
  width:80px; height:80px;
  border-radius:20px;
  margin-bottom:20px;
  object-fit:contain;
  position:relative; z-index:1;
}
.login-brand-side h1 {
  font-size:2rem; font-weight:700;
  color:var(--text-primary);
  margin-bottom:8px;
  position:relative; z-index:1;
}
.login-brand-side h1 span,
.feature-item i {
  color:var(--brand-orange);
  filter:drop-shadow(0 0 8px rgba(96,165,250,0.40));
}
.login-brand-side p {
  color:var(--text-secondary);
  font-size:0.95rem;
  margin-bottom:25px;
  position:relative; z-index:1;
}
.feature-list {
  display:flex; flex-direction:column;
  gap:10px;
  position:relative; z-index:1;
}
.feature-item {
  display:flex; align-items:center;
  gap:12px;
  color:var(--text-secondary);
  font-size:0.9rem;
}
.feature-item i {
  font-size:1.1rem;
  width:24px;
  text-align:center;
}

.login-form-side {
  background:linear-gradient(135deg, rgba(15,23,42,0.55), rgba(30,58,138,0.30));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.form {
  width:100%;
  max-width:380px;
  padding:10px;
}
.form h3 { font-weight:700; color:var(--text-primary); margin-bottom:4px; }
.form .subtitle {
  color:var(--text-secondary);
  font-size:0.9rem;
  margin-bottom:25px;
}
.form .subtitle span { color:var(--brand-orange); }

.group {
  position:relative;
  margin-bottom:25px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--glass-blue-border);
  padding:4px 0;
  transition:border-color .3s ease;
}
.group:focus-within {
  border-color:#3b82f6;
  box-shadow:0 4px 12px -4px rgba(59,130,246,0.35);
}
.group i {
  color:var(--text-secondary);
  font-size:1.1rem;
  width:28px;
  text-align:center;
  transition:color .3s ease;
}
.group:focus-within i { color:#60a5fa; }
.input-con-linea {
  flex:1;
  background:transparent;
  border:none;
  padding:10px 8px;
  color:var(--text-primary);
  font-size:0.95rem;
  outline:none;
}
.input-con-linea::placeholder { color:transparent; }
.group label {
  position:absolute;
  left:36px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-muted);
  font-size:0.9rem;
  transition:all .3s ease;
  pointer-events:none;
}
.input-con-linea:focus ~ label,
.input-con-linea:not(:placeholder-shown) ~ label {
  top:-10px;
  font-size:0.7rem;
  color:#60a5fa;
}
.group .fa-eye,
.group .fa-eye-slash {
  cursor:pointer;
  font-size:1rem;
  padding:0 8px;
}

.login-btn-wrapper { margin:20px 0 15px; }
.login-btn-glass {
  width:100%;
  padding:14px;
  border:1px solid rgba(96,165,250,0.30);
  border-radius:14px;
  background:linear-gradient(135deg, rgba(255,107,53,0.95), rgba(255,140,90,0.95));
  color:#fff;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:
    0 8px 24px -6px rgba(255,107,53,0.55),
    0 0 20px rgba(59,130,246,0.20),
    inset 0 1px 0 rgba(255,255,255,0.20);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:all .3s ease;
}
.login-btn-glass:hover {
  box-shadow:
    0 14px 32px -6px rgba(255,107,53,0.70),
    0 0 28px rgba(59,130,246,0.40),
    inset 0 1px 0 rgba(255,255,255,0.30);
}
.login-btn-glass:disabled { opacity:.7; cursor:not-allowed; }

.login-footer-links { text-align:center; margin:10px 0 20px; }
.login-footer-links a {
  color:var(--text-secondary);
  text-decoration:none;
  font-size:0.85rem;
  transition:color .3s ease;
}
.login-footer-links a:hover { color:var(--brand-orange); }

.login-social-footer {
  text-align:center;
  padding-top:15px;
  border-top:1px solid var(--glass-border);
}
.social-icons {
  display:flex; justify-content:center;
  gap:12px; flex-wrap:wrap;
  margin-bottom:12px;
}
.social-icon {
  width:38px; height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary);
  text-decoration:none;
  transition:all .3s ease;
  font-size:0.9rem;
  position:relative;
}
.social-icon:hover {
  background:var(--brand-orange);
  color:#fff;
  border-color:var(--brand-orange);
  transform:translateY(-2px);
}
.login-copyright {
  color:var(--text-muted);
  font-size:0.7rem;
}
.login-copyright a {
  color:var(--brand-orange);
  text-decoration:none;
}

/* ============================================================
   8. LAYOUT PRINCIPAL + SIDEBAR
   ============================================================ */
#mainContainer {
  display:flex;
  width:100%;
  height:100vh;
  overflow:hidden;
  min-width:0;
}
.navigation {
  width:var(--sidebar-width);
  min-height:100vh;
  background:linear-gradient(180deg, rgba(8,47,73,0.85), rgba(15,23,42,0.90));
  backdrop-filter:blur(var(--blur-lg)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur-lg)) saturate(140%);
  border-right:1px solid var(--glass-blue-border);
  padding:0 0 20px 0;
  transition:all .35s cubic-bezier(0.22,0.61,0.36,1);
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  z-index:100;
  flex-shrink:0;
  box-shadow:4px 0 24px -8px rgba(0,0,0,0.50);
}
.navigation.collapsed { width:var(--sidebar-collapsed-width); }
.navigation.collapsed ~ .sidebar-toggle,
.sidebar-toggle.collapsed { left:var(--sidebar-collapsed-width); }
.navigation.collapsed .text,
.navigation.collapsed .arrow { display:none; opacity:0; }
.navigation.collapsed ul li a { justify-content:center; padding:12px; }
.navigation.collapsed .logo-circle-glass { width:40px; height:40px; margin:0 auto; }

.navigation ul { list-style:none; padding:0; margin:0; }
.navigation ul li { padding:0 8px; margin:2px 0; }
.navigation ul li a {
  display:flex;
  align-items:center;
  padding:10px 14px;
  border-radius:12px;
  color:var(--text-secondary);
  text-decoration:none;
  transition:all .25s ease;
  font-size:0.9rem;
  gap:12px;
  cursor:pointer;
}
.navigation ul li a:hover {
  background:rgba(59,130,246,0.15);
  color:#93c5fd;
  box-shadow:inset 3px 0 0 #3b82f6;
}
.navigation ul li.active a {
  background:linear-gradient(90deg, rgba(59,130,246,0.25), transparent);
  color:#60a5fa;
  box-shadow:inset 3px 0 0 #60a5fa;
}
.navigation ul li .icon {
  font-size:1.2rem;
  width:28px;
  text-align:center;
  flex-shrink:0;
}
.navigation ul li .text { flex:1; white-space:nowrap; }
.navigation ul li .arrow {
  margin-left:auto;
  font-size:0.7rem;
  transition:transform .3s ease;
}
.navigation ul li.submenu.open > a .arrow { transform:rotate(180deg); }
.navigation ul li .sub-menu {
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease;
  padding-left:12px;
  background:rgba(8,47,73,0.40);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:0 0 12px 12px;
}
.navigation ul li.submenu.open .sub-menu { max-height:500px; }
.navigation ul li .sub-menu li a { padding:8px 14px 8px 40px; font-size:0.85rem; }
.navigation ul li .sub-menu li a:hover {
  background:rgba(59,130,246,0.10);
  color:#93c5fd;
}

.logo-circle-glass {
  width:48px; height:48px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(147,197,253,0.40);
  display:flex; align-items:center; justify-content:center;
  transition:all .3s ease;
  background:linear-gradient(135deg, rgba(59,130,246,0.30), rgba(37,99,235,0.45));
  box-shadow:
    0 0 24px rgba(59,130,246,0.45),
    inset 0 1px 0 rgba(255,255,255,0.20);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.logo-circle-glass img { width:100%; height:100%; object-fit:cover; }

.sidebar-mobile-overlay,
.sidebar-overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(8,47,73,0.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:10000;
  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease, visibility .3s ease;
}
.sidebar-mobile-overlay.active,
.sidebar-overlay.active { opacity:1; visibility:visible; }

/* ============================================================
   9. CONTENIDO + NAVBAR + HEADER (HOMOGÉNEO Y COHESIVO)
   ============================================================ */
.main-content-glass {
  flex:1;
  padding:16px 24px 24px 24px;
  transition:all .35s cubic-bezier(0.22,0.61,0.36,1);
  min-height:100vh;
  overflow-x:hidden;
  width:auto;
  max-width:100%;
  min-width:0;
  background:
    radial-gradient(circle at 70% 0%, rgba(59,130,246,0.06), transparent 50%),
    linear-gradient(135deg, rgba(15,23,42,0.20), rgba(8,47,73,0.15));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.main-content-glass.sidebar-collapsed {
  margin-left:0;
  width:calc(100% - 70px);
  max-width:calc(100% - 70px);
}

.sidebar-toggle {
  position:fixed;
  top:50%;
  left:var(--sidebar-width);
  transform:translateY(-50%);
  width:28px; height:48px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);
  border-left:none;
  border-radius:0 12px 12px 0;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  z-index:101;
  transition:all .35s cubic-bezier(0.22,0.61,0.36,1);
  color:var(--text-secondary);
  backdrop-filter:blur(10px);
}
.sidebar-toggle:hover { background:rgba(255,255,255,0.08); color:var(--text-primary); }

/* Barra de Navegación */
.navbar-glass {
  background:linear-gradient(135deg, rgba(15,23,42,0.85), rgba(30,58,138,0.45)) !important;
  backdrop-filter:blur(var(--blur-md)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(150%);
  border:1px solid var(--glass-blue-border) !important;
  border-radius:18px;
  padding:8px 16px;
  margin-bottom:14px;
  width:100%;
  overflow:visible;
  min-width:0;
  box-sizing:border-box;
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,0.50),
    0 0 0 1px rgba(96,165,250,0.10),
    inset 0 1px 0 rgba(255,255,255,0.08);
}
.navbar-glass .container-fluid { padding:0; flex-wrap:nowrap; min-width:0; }
.navbar-glass .navbar-collapse { flex:1; overflow:hidden; min-width:0; }
.navbar-glass .navbar-brand { flex-shrink:0; margin-right:8px; }

.mobile-sidebar-toggle {
  display:none;
  width:36px; height:36px;
  border-radius:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--glass-border);
  color:var(--text-secondary);
  align-items:center; justify-content:center;
  cursor:pointer;
  transition:all .3s ease;
  flex-shrink:0;
  margin-right:8px;
}
.mobile-sidebar-toggle:hover { background:rgba(255,255,255,0.06); color:var(--text-primary); }

/* Píldoras de Navegación */
.nav-pills-glass {
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:4px;
  padding:4px 6px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  min-width:0;
  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(96,165,250,0.18);
  border-radius:14px;
}
.nav-pills-glass::-webkit-scrollbar { display:none; }
.nav-pills-glass .nav-link {
  color:var(--text-secondary);
  border-radius:10px;
  padding:6px 14px;
  font-size:0.82rem;
  font-weight:600;
  transition:all .25s ease;
  white-space:nowrap;
  flex-shrink:0;
  border:none;
  background:transparent;
}
.nav-pills-glass .nav-link:hover {
  background:rgba(59,130,246,0.15);
  color:#93c5fd;
}
.nav-pills-glass .nav-link.active {
  background:linear-gradient(135deg, var(--brand-orange, #ff6b35), #ea580c) !important;
  color:#fff !important;
  box-shadow:0 4px 14px rgba(255,107,53,0.45);
}

/* Botones Iconos de Acción a la Derecha */
.nav-icon-btn-glass {
  width:38px; height:38px;
  border-radius:12px;
  background:rgba(15,23,42,0.65) !important;
  border:1px solid rgba(96,165,250,0.22) !important;
  color:#cbd5e1 !important;
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
  flex-shrink:0;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.nav-icon-btn-glass:hover {
  background:rgba(59,130,246,0.20) !important;
  border-color:rgba(147,197,253,0.50) !important;
  color:#93c5fd !important;
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(59,130,246,0.30);
}
.nav-icon-btn-glass .badge-notification-glass {
  position:absolute;
  top:-4px; right:-4px;
  background:linear-gradient(135deg, #ef4444, #dc2626) !important;
  color:#fff !important;
  font-size:0.62rem;
  font-weight:800;
  min-width:18px; height:18px;
  padding:0 4px;
  border-radius:9999px;
  display:inline-flex; align-items:center; justify-content:center;
  border:2px solid rgba(15,23,42,0.9);
  box-shadow:0 2px 8px rgba(239,68,68,0.5);
}

/* Header de Tasas (Subheader con Dashboard y USD/EUR) */
.header-glass-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 18px;
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.35)) !important;
  backdrop-filter:blur(var(--blur-md)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(140%);
  border:1px solid var(--glass-blue-border) !important;
  border-radius:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:10px;
  width:100%;
  min-width:0;
  box-sizing:border-box;
  box-shadow:0 6px 20px -8px rgba(0,0,0,0.40);
}
.header-glass-bar h2 { margin:0; font-size:1.1rem; font-weight:700; color:var(--text-primary); flex-shrink:0; }
.header-glass-bar > div { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* Badges de Tasas USD y EUR */
.tasa-badge-glass {
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(15,23,42,0.60) !important;
  padding:5px 14px;
  border-radius:30px;
  border:1px solid rgba(96,165,250,0.25) !important;
  font-size:0.75rem;
  cursor:pointer;
  transition:all .25s ease;
  flex-shrink:0;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.tasa-badge-glass:hover {
  background:rgba(59,130,246,0.20) !important;
  border-color:rgba(147,197,253,0.50) !important;
  box-shadow:0 0 16px rgba(59,130,246,0.35);
  transform:translateY(-1px);
}
.tasa-badge-glass i { font-size:0.95rem; color:#93c5fd; }
.tasa-badge-glass h5 { margin:0; font-size:0.72rem; font-weight:700; color:#93c5fd; }
.tasa-value {
  color:var(--brand-orange);
  font-weight:700;
  cursor:pointer;
  transition:color .25s ease;
  font-size:0.95rem;
  font-variant-numeric:tabular-nums;
}
.tasa-value:hover { color:#ff8c5a; }

/* ============================================================
   10. PAGES + CONTENT
   ============================================================ */
.pages {
  display:none;
  animation:fadeIn .3s ease;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  min-width:0;
}
.pages.active { display:block; }
#mainIndex { width:100%; max-width:100%; overflow-x:hidden; min-width:0; }
#mainContent { width:100%; max-width:100%; overflow-x:hidden; padding:16px 20px 24px 20px; min-width:0; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ============================================================
   11. LOADING OVERLAY
   ============================================================ */
.loading-overlay {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  background:rgba(15,17,21,0.85);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center; justify-content:center;
  flex-direction:column;
  z-index:9999;
  gap:20px;
}
.loading-spinner {
  width:50px; height:50px;
  border:3px solid var(--glass-border);
  border-top-color:var(--brand-orange);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-title { color:var(--text-primary); font-size:1.2rem; font-weight:500; margin:0; }
.progress-container {
  width:300px; max-width:80%;
  height:4px;
  background:var(--glass-border);
  border-radius:4px;
  overflow:hidden;
}
.progress-bar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--brand-orange), #ff8c5a);
  border-radius:4px;
  transition:width .3s ease;
}
.hidden { display:none !important; }

/* ============================================================
   12. DASHBOARD
   ============================================================ */
#pDashBoard { width:100%; max-width:100%; overflow-x:hidden; padding:0; min-width:0; }
.dashboard-cards-container {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:16px;
  width:100%;
  max-width:100%;
  padding:0;
  margin-bottom:20px;
}
.dashboard-card {
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.30));
  border:1px solid var(--glass-blue-border);
  border-radius:16px;
  padding:16px 18px;
  transition:all .3s ease;
  min-width:0;
  overflow:hidden;
  position:relative;
  backdrop-filter:blur(var(--blur-md)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(140%);
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
.dashboard-card:hover {
  transform:translateY(-2px);
  border-color:rgba(147,197,253,0.40);
  box-shadow:
    0 14px 32px -8px rgba(0,0,0,0.55),
    0 0 24px rgba(59,130,246,0.25);
}
.dashboard-card .card-icon {
  width:40px; height:40px;
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem;
  margin-bottom:10px;
  flex-shrink:0;
}
.dashboard-card .card-label {
  font-size:0.7rem; font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-muted);
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.dashboard-card .card-value {
  font-size:1.4rem;
  font-weight:700;
  color:var(--text-primary);
  line-height:1.2;
  word-break:break-word;
}
.dashboard-card .card-value.positive { color:#10b981; }
.dashboard-card .card-value.negative { color:#ef4444; }
.dashboard-card .card-sub { font-size:0.7rem; color:var(--text-muted); margin-top:4px; }

.card-icon.blue   { background:rgba(59,130,246,0.15);   color:#3b82f6; }
.card-icon.green  { background:rgba(16,185,129,0.15);   color:#10b981; }
.card-icon.orange { background:rgba(245,158,11,0.15);   color:#f59e0b; }
.card-icon.red    { background:rgba(239,68,68,0.15);    color:#ef4444; }
.card-icon.purple { background:rgba(139,92,246,0.15);  color:#8b5cf6; }
.card-icon.pink   { background:rgba(236,72,153,0.15);  color:#ec4899; }
.card-icon.teal   { background:rgba(20,184,166,0.15);   color:#14b8a6; }
.card-icon.indigo { background:rgba(99,102,241,0.15);  color:#6366f1; }

/* ============================================================
   13. CHARTS + STAT CARDS
   ============================================================ */
.charts-row {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  width:100%;
  max-width:100%;
  margin-top:10px;
}
.chart-card {
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.30));
  border:1px solid var(--glass-blue-border);
  border-radius:16px;
  padding:20px;
  min-width:0;
  overflow:hidden;
  backdrop-filter:blur(var(--blur-md)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(140%);
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
.chart-card .chart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.chart-card .chart-header h5 { margin:0; font-size:0.95rem; font-weight:600; color:var(--text-primary); }
.chart-wrapper { position:relative; height:280px; width:100%; }
.chart-wrapper canvas { width:100% !important; height:100% !important; max-width:100%; }

.scroll-row {
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:16px;
  padding:4px 2px 12px 2px;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
  width:100%;
  max-width:100%;
}
.scroll-row::-webkit-scrollbar { height:4px; }
.scroll-row::-webkit-scrollbar-track { background:var(--glass-border); border-radius:4px; }
.scroll-row::-webkit-scrollbar-thumb { background:var(--brand-orange); border-radius:4px; }
.scroll-row .stat-card { flex:0 0 200px; min-width:170px; max-width:220px; }

.stat-card {
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.30));
  border:1px solid var(--glass-blue-border);
  border-radius:16px;
  padding:1.25rem;
  transition:all .3s ease-out;
  flex:0 0 210px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  position:relative;
  overflow:hidden;
  box-shadow:
    0 8px 24px -8px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
.stat-card::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:100%; height:4px;
  background-color:var(--card-accent-color,#888);
  transition:height .3s ease;
}
.stat-card-header small {
  color:var(--text-secondary);
  font-size:0.8rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.stat-card-body h6 {
  margin:0;
  color:var(--text-primary);
  font-weight:700;
  font-size:2.25rem;
  line-height:1.1;
}
.stat-card-content { z-index:1; position:relative; }
.background-icon {
  position:absolute;
  bottom:-20px; right:-15px;
  font-size:4.5rem;
  color:rgba(255,255,255,0.04);
  transform:rotate(-15deg);
  transition:transform .4s ease, color .4s ease, opacity .4s ease;
  z-index:0;
}
[data-bs-theme="light"] .background-icon {
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  opacity:0.15;
}
.stat-card:hover {
  transform:translateY(-6px);
  background:var(--bg-card);
  box-shadow:0 10px 25px -5px rgba(0,0,0,0.2);
  border-color:rgba(147,197,253,0.40);
}
.stat-card:hover::before { height:6px; }
.stat-card:hover .background-icon { transform:rotate(-8deg) scale(1.1); }
[data-bs-theme="light"] .stat-card:hover .background-icon { opacity:0.25; }

/* ============================================================
   14. CARDS (Bootstrap override, mantener !important)
   ============================================================ */
.card {
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.30)) !important;
  border:1px solid var(--glass-blue-border) !important;
  border-radius:16px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.card-header {
  background:transparent !important;
  color:var(--text-primary) !important;
  border-bottom:1px solid var(--glass-border) !important;
  font-weight:600;
  padding:1rem 1.25rem;
}
.glass-card {
  background:linear-gradient(135deg, rgba(15,23,42,0.75), rgba(30,58,138,0.30));
  border:1px solid var(--glass-blue-border);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

[data-bs-theme="light"] .dashboard-card,
[data-bs-theme="light"] .stat-card,
[data-bs-theme="light"] .chart-card,
[data-bs-theme="light"] .glass-card,
[data-bs-theme="light"] .card {
  background:linear-gradient(135deg, rgba(255,255,255,0.85), rgba(219,234,254,0.50)) !important;
  border:1px solid rgba(96,165,250,0.30) !important;
  backdrop-filter:blur(var(--blur-md));
  -webkit-backdrop-filter:blur(var(--blur-md));
}

/* ============================================================
   15. SKELETON
   ============================================================ */
.skeleton {
  background:linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.08) 75%);
  background-size:200% 100%;
  animation:skeleton-loading 1.5s infinite linear;
  border-radius:8px;
  color:transparent !important;
  user-select:none;
}
h6.skeleton { height:2.5rem; width:70%; margin-top:4px; }
@keyframes skeleton-loading { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

/* ============================================================
   16. SIDEBAR PANEL (modal lateral)
   ============================================================ */
.sidebar-panel {
  position:fixed;
  top:0; right:0;
  width:400px;
  max-width:85%;
  height:100%;
  background:linear-gradient(135deg, rgba(15,23,42,0.88), rgba(30,58,138,0.50));
  backdrop-filter:blur(var(--blur-xl)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur-xl)) saturate(150%);
  color:var(--text-primary);
  border-left:1px solid var(--glass-blue-border);
  box-shadow:-8px 0 40px -8px rgba(0,0,0,0.60);
  z-index:10001;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(0.25,1,0.5,1);
  display:flex;
  flex-direction:column;
}
.sidebar-overlay.active .sidebar-panel { transform:translateX(0); }
.sidebar-header {
  padding:20px;
  border-bottom:1px solid var(--glass-blue-border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(59,130,246,0.10);
}
.sidebar-body { padding:20px; overflow-y:auto; flex-grow:1; }
.sidebar-footer { padding:15px 20px; border-top:1px solid var(--glass-border); text-align:right; }
.sidebar-close-btn {
  background:none;
  border:none;
  font-size:1.5rem;
  color:var(--text-secondary);
  cursor:pointer;
  transition:color .2s;
}
.sidebar-close-btn:hover { color:var(--text-primary); }

/* Ocultar todos los submenús por defecto */
.sidebar-panel ul.sub-menu,
.sidebar ul.sub-menu {
    display: none;
}

/* Mostrar SOLO el submenú directamante dentro del <li> activo */
.sidebar-panel li.submenu.active > ul.sub-menu,
.sidebar-panel li.submenu.show > ul.sub-menu,
.sidebar li.submenu.active > ul.sub-menu,
.sidebar li.submenu.show > ul.sub-menu {
    display: block;
}
/* ============================================================
   17. BADGES + PROFILE
   ============================================================ */
.badge-success {
  background:rgba(16,185,129,0.15);
  color:#10b981;
  padding:2px 10px;
  border-radius:30px;
  font-size:0.7rem;
  font-weight:600;
}
.badge-danger {
  background:rgba(239,68,68,0.15);
  color:#ef4444;
  padding:2px 10px;
  border-radius:30px;
  font-size:0.7rem;
  font-weight:600;
}
.profile-avatar {
  width:120px; height:120px;
  border-radius:50%;
  border:4px solid var(--brand-orange);
  object-fit:cover;
}
.profile-role-badge {
  display:inline-block;
  background:rgba(255,107,53,0.15);
  color:var(--brand-orange);
  padding:4px 16px;
  border-radius:30px;
  font-size:0.85rem;
  font-weight:600;
}
.profile-details {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid var(--glass-border);
}
.detail-item label {
  font-size:0.75rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.detail-item p { color:var(--text-primary); margin:4px 0 0 0; font-weight:500; }
.permisos-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.permiso-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 12px;
  background:rgba(255,255,255,0.03);
  border-radius:8px;
  border:1px solid var(--glass-border);
}
.permiso-nombre { font-size:0.85rem; color:var(--text-secondary); }
.profile-page-container { max-width:900px; margin:0 auto; padding:10px 0; }
.profile-grid-compact { display:grid; grid-template-columns:1fr; gap:20px; }
.profile-avatar-section { display:flex; align-items:center; gap:25px; flex-wrap:wrap; }
.profile-info-main h3 { color:var(--text-primary); font-weight:700; margin:0 0 4px 0; }
.profile-nombre { color:var(--text-primary); font-weight:700; margin:0; }
.permisos-title {
  color:var(--text-primary);
  font-size:1rem;
  font-weight:600;
  margin:0 0 16px 0;
}
.permisos-title i { color:var(--brand-orange); }

/* ============================================================
   18. USER MENU (modal vertical - items)
   ============================================================ */
.user-card-vertical-info {
  width:100%;
  padding:20px 16px 16px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  background:linear-gradient(180deg, rgba(249,115,22,0.1), transparent);
  flex-shrink:0;
}
.user-avatar-circle {
  width:62px; height:62px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--brand-orange), #ea580c);
  color:#fff;
  font-weight:800;
  font-size:1.5rem;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(249,115,22,0.4);
  border:2px solid rgba(255,255,255,0.25);
}
.user-info-text .user-name { font-weight:700; font-size:1.05rem; color:#fff; line-height:1.2; }
.user-info-text .user-role-badge {
  display:inline-block;
  font-size:0.72rem;
  font-weight:700;
  letter-spacing:0.04em;
  padding:3px 10px;
  border-radius:9999px;
  background:rgba(249,115,22,0.2);
  color:var(--brand-orange);
  border:1px solid rgba(249,115,22,0.4);
  margin-top:4px;
}
.user-actions-vertical-list {
  width:100%;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}
.user-action-item {
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(59,130,246,0.06);
  border:1px solid rgba(96,165,250,0.15);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#e2e8f0;
  text-decoration:none;
  font-size:0.92rem;
  font-weight:500;
  min-height:46px;
  transition:all .25s ease;
}
.user-action-item i:first-child { font-size:1.15rem; width:24px; text-align:center; }
.user-action-item:hover,
.user-action-item:active {
  background:rgba(59,130,246,0.18);
  border-color:rgba(147,197,253,0.40);
  color:#fff;
}
.user-action-item.text-danger:active { background:rgba(239,68,68,0.2); }
.user-divider { width:100%; height:1px; background:rgba(255,255,255,0.1); margin:4px 0; }

.modal-vertical-footer {
  width:100%;
  padding:12px 16px;
  border-top:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.02);
  flex-shrink:0;
}
.btn-modal-close-wide {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);
  color:#cbd5e1;
  font-weight:600;
  font-size:0.9rem;
  cursor:pointer;
  text-align:center;
}
.btn-modal-close-wide:hover,
.btn-modal-close-wide:active {
  background:rgba(255,255,255,0.15);
  color:#fff;
}

/* ============================================================
   19. TITULO SECCION + BTN DYNAMIC
   ============================================================ */
.titulo-seccion {
  background:linear-gradient(135deg, rgba(255,165,100,0.18), rgba(59,130,246,0.15));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;
  padding:20px 30px;
  border-radius:20px;
  margin-bottom:24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  box-shadow:
    0 8px 32px rgba(255,140,60,0.15),
    0 0 24px rgba(59,130,246,0.20);
  border:1px solid rgba(147,197,253,0.30);
}
.titulo-seccion h3 {
  margin:0;
  font-size:22px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:12px;
}
.titulo-seccion .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
.titulo-seccion .header-actions .btn {
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;
  padding:8px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:13px;
  transition:all .3s;
  text-decoration:none;
  cursor:pointer;
}
.titulo-seccion .header-actions .btn:hover {
  background:rgba(255,255,255,0.25);
  transform:translateY(-2px);
}
.titulo-seccion .header-actions .btn-warning {
  background:rgba(245,158,11,0.3);
  border-color:rgba(245,158,11,0.4);
  color:#fff;
}
.titulo-seccion .header-actions .btn-warning:hover { background:rgba(245,158,11,0.5); }

.btn-dynamic {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:38px;
  width:38px;
  padding:0;
  border-radius:12px;
  background:var(--bg-card);
  border:1px solid var(--glass-border);
  color:var(--text-secondary);
  cursor:pointer;
  overflow:hidden;
  white-space:nowrap;
  font-size:0.85rem;
  font-weight:600;
  outline:none;
  text-decoration:none;
  --btn-color:var(--brand-orange);
  transition:all .3s ease;
}
.btn-dynamic i,
.btn-dynamic svg {
  font-size:1rem;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  stroke-width:2.5px;
  font-weight:900;
}
.btn-dynamic span {
  opacity:0;
  max-width:0;
  padding:0; margin:0;
  overflow:hidden;
  transition:max-width .35s cubic-bezier(0.16,1,0.3,1), opacity .25s ease, margin .3s ease;
  display:inline-block;
}
.btn-dynamic:hover,
.btn-dynamic.expanded {
  width:auto;
  min-width:80px;
  padding:0 16px;
  background:var(--btn-color);
  border-color:var(--btn-color);
  color:#fff;
  box-shadow:
    0 8px 20px -4px var(--btn-color),
    0 0 18px rgba(59,130,246,0.30);
}
.btn-dynamic:hover span,
.btn-dynamic.expanded span {
  opacity:1;
  max-width:200px;
  margin-left:8px;
}
.btn-dynamic:active { transform:scale(0.95); }
.btn-dynamic.aceptar     { --btn-color:#10b981; }
.btn-dynamic.cancelar   { --btn-color:#ef4444; }
.btn-dynamic.ayuda       { --btn-color:#39ff14; }
.btn-dynamic.advertencia{ --btn-color:#f59e0b; }
.btn-dynamic.anular      { --btn-color:#eab308; }
.btn-dynamic.teal        { --btn-color:#14b8a6; }
.btn-dynamic.info        { --btn-color:#ffffff; }
.btn-dynamic.info:hover,
.btn-dynamic.info.expanded { color:#111827; }
.btn-dynamic.info i,
.btn-dynamic.info svg {
  color:#ffffff;
  -webkit-text-stroke:0.8px #ffffff;
}

/* ============================================================
   20. MNU (Manual de usuario)
   ============================================================ */
.mnu-root {
  --mnu-primary:var(--brand-orange, #ff6b35);
  --mnu-primary-soft:rgba(255,107,53,0.15);
  --mnu-primary-hover:#ff8c5a;
  --mnu-accent:#f59e0b;
  --mnu-bg:#0f1115;
  --mnu-sidebar-bg:rgba(15,17,21,0.95);
  --mnu-sidebar-text:#9ca3af;
  --mnu-card:rgba(31,41,55,0.5);
  --mnu-text:#f9fafb;
  --mnu-text-muted:#6b7280;
  --mnu-border:rgba(255,255,255,0.08);
  --mnu-radius:14px;
  --mnu-shadow:0 10px 30px rgba(0,0,0,0.4);
  --mnu-note-bg:rgba(255,107,53,0.08);
  --mnu-note-border:#ff6b35;
  --mnu-warn-bg:rgba(245,158,11,0.10);
  --mnu-warn-border:#f59e0b;
  --mnu-ok-bg:rgba(16,185,129,0.10);
  --mnu-ok-border:#10b981;
  --mnu-sidebar-w:270px;
  font-family:'Poppins',sans-serif;
  background:var(--mnu-bg);
  color:var(--mnu-text);
  line-height:1.6;
  min-height:100vh;
  margin:0;
}
[data-bs-theme="light"] .mnu-root {
  --mnu-bg:#f3f4f6;
  --mnu-sidebar-bg:#0f1115;
  --mnu-sidebar-text:#9ca3af;
  --mnu-card:rgba(255,255,255,0.85);
  --mnu-text:#111827;
  --mnu-text-muted:#6b7280;
  --mnu-border:rgba(0,0,0,0.08);
  --mnu-shadow:0 4px 14px rgba(0,0,0,0.08);
}
.mnu-root * { box-sizing:border-box; }
.mnu-layout { display:grid; grid-template-columns:var(--mnu-sidebar-w) 1fr; min-height:100vh; }
.mnu-sidebar {
  background:var(--mnu-sidebar-bg);
  color:var(--mnu-sidebar-text);
  display:flex;
  flex-direction:column;
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  z-index:100;
  border-right:1px solid rgba(255,255,255,0.06);
  scrollbar-width:thin;
}
.mnu-sidebar::-webkit-scrollbar { width:6px; }
.mnu-sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
.mnu-sidebar-brand { padding:20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.06); }
.mnu-brand-logo {
  width:44px; height:44px;
  border-radius:12px;
  background:linear-gradient(135deg, var(--mnu-primary), var(--mnu-primary-hover));
  color:white;
  display:flex; align-items:center; justify-content:center;
  font-weight:800;
  font-size:1rem;
  flex-shrink:0;
  box-shadow:0 6px 18px rgba(255,107,53,0.3);
}
.mnu-brand-text strong { color:#f9fafb; display:block; font-size:0.95rem; line-height:1.2; }
.mnu-brand-text small { color:var(--mnu-sidebar-text); font-size:0.75rem; }
.mnu-sidebar-search { padding:14px 16px; }
.mnu-sidebar-search input {
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(255,255,255,0.04);
  color:#f9fafb;
  font-size:0.85rem;
  outline:none;
  transition:all .2s;
  font-family:inherit;
}
.mnu-sidebar-search input::placeholder { color:#6b7280; }
.mnu-sidebar-search input:focus { border-color:var(--mnu-primary); background:rgba(255,107,53,0.06); }
.mnu-sidebar-nav { flex:1; padding:8px 12px; overflow-y:auto; }
.mnu-nav-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:0.88rem;
  color:var(--mnu-sidebar-text);
  margin-bottom:3px;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  transition:all .15s;
  font-family:inherit;
}
.mnu-nav-item:hover { background:rgba(255,255,255,0.05); color:#f9fafb; }
.mnu-nav-item.active {
  background:rgba(255,107,53,0.15);
  color:var(--mnu-primary);
  font-weight:600;
  box-shadow:inset 3px 0 0 var(--mnu-primary);
}
.mnu-nav-icon { font-size:1.05rem; }
.mnu-nav-label { flex:1; }
.mnu-nav-count {
  font-size:0.7rem;
  background:rgba(255,255,255,0.10);
  padding:2px 7px;
  border-radius:10px;
}
.mnu-nav-item.active .mnu-nav-count { background:rgba(255,107,53,0.25); }
.mnu-sidebar-footer { padding:14px 16px; border-top:1px solid rgba(255,255,255,0.06); }
.mnu-user-info { display:flex; align-items:center; gap:10px; }
.mnu-user-avatar {
  width:36px; height:36px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--mnu-primary), var(--mnu-primary-hover));
  color:white;
  display:flex; align-items:center; justify-content:center;
  font-weight:700;
  font-size:0.85rem;
  flex-shrink:0;
  text-transform:uppercase;
}
.mnu-user-details { display:flex; flex-direction:column; min-width:0; gap:2px; }
.mnu-user-details small { font-size:0.7rem; color:var(--mnu-sidebar-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mnu-badge-info {
  display:inline-block;
  padding:2px 8px;
  border-radius:20px;
  font-size:0.68rem;
  font-weight:600;
  background:rgba(255,107,53,0.15);
  color:var(--mnu-primary);
  text-transform:capitalize;
  width:fit-content;
}
.mnu-content { display:flex; flex-direction:column; min-height:100vh; min-width:0; }
.mnu-topbar {
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 28px;
  border-bottom:1px solid var(--mnu-border);
  background:var(--mnu-card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:50;
}
.mnu-topbar h1 {
  flex:1;
  font-size:1.05rem;
  color:var(--mnu-text);
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin:0;
}
.mnu-topbar-actions { display:flex; gap:6px; align-items:center; }
.mnu-icon-btn {
  width:38px; height:38px;
  border-radius:10px;
  border:1px solid var(--mnu-border);
  background:rgba(255,255,255,0.03);
  color:var(--mnu-text);
  cursor:pointer;
  font-size:0.95rem;
  display:flex; align-items:center; justify-content:center;
  transition:all .18s;
  flex-shrink:0;
  font-family:inherit;
}
.mnu-icon-btn:hover { background:var(--mnu-primary-soft); border-color:var(--mnu-primary); color:var(--mnu-primary); transform:translateY(-1px); }
.mnu-icon-btn:active { transform:scale(0.95); }
#mnu-sidebar-toggle { display:none; }
.mnu-content-body { flex:1; padding:28px; max-width:1050px; width:100%; }
.mnu-content-footer {
  padding:14px 28px;
  border-top:1px solid var(--mnu-border);
  display:flex;
  justify-content:space-between;
  font-size:0.78rem;
  color:var(--mnu-text-muted);
  gap:10px;
  flex-wrap:wrap;
}
.mnu-module-header { margin-bottom:24px; padding-bottom:18px; border-bottom:2px solid var(--mnu-border); }
.mnu-module-title {
  font-size:1.5rem;
  color:var(--mnu-text);
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 8px 0;
  font-weight:700;
}
.mnu-module-desc { color:var(--mnu-text-muted); font-size:0.95rem; margin:0; }
.mnu-step {
  border:1px solid var(--mnu-border);
  border-radius:var(--mnu-radius);
  margin-bottom:10px;
  overflow:hidden;
  transition:all .25s;
  background:var(--mnu-card);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.mnu-step:hover { box-shadow:var(--mnu-shadow); transform:translateY(-1px); }
.mnu-step.open { border-color:var(--mnu-primary); box-shadow:0 8px 24px rgba(255,107,53,0.12); }
.mnu-step-header { display:flex; align-items:center; gap:12px; padding:15px 20px; cursor:pointer; user-select:none; }
.mnu-step-number {
  flex-shrink:0;
  width:32px; height:32px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--mnu-primary), var(--mnu-primary-hover));
  color:white;
  display:flex; align-items:center; justify-content:center;
  font-weight:700;
  font-size:0.82rem;
  box-shadow:0 4px 10px rgba(255,107,53,0.3);
}
.mnu-step-title { flex:1; font-weight:500; font-size:0.95rem; color:var(--mnu-text); word-break:break-word; }
.mnu-step-toggle { color:var(--mnu-text-muted); transition:transform .25s; font-size:0.75rem; }
.mnu-step.open .mnu-step-toggle { transform:rotate(180deg); color:var(--mnu-primary); }
.mnu-step-body {
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease, padding .35s ease;
  padding:0 20px;
  color:var(--mnu-text-muted);
  font-size:0.9rem;
}
.mnu-step.open .mnu-step-body { max-height:3000px; padding:4px 20px 20px; }
.mnu-step-body p { margin-bottom:10px; color:var(--mnu-text); }
.mnu-step-body ul { padding-left:22px; margin:8px 0; }
.mnu-step-body li { margin-bottom:6px; }
.mnu-step-body img { max-width:100%; border-radius:10px; margin:12px 0; border:1px solid var(--mnu-border); box-shadow:var(--mnu-shadow); }
.mnu-step-body iframe { width:100%; aspect-ratio:16/9; border-radius:10px; margin:12px 0; border:1px solid var(--mnu-border); }
.mnu-note, .mnu-warn, .mnu-ok {
  padding:12px 16px;
  border-radius:10px;
  margin-top:12px;
  font-size:0.85rem;
  border-left:4px solid;
  line-height:1.55;
  color:var(--mnu-text);
}
.mnu-note { background:var(--mnu-note-bg); border-color:var(--mnu-note-border); }
.mnu-warn { background:var(--mnu-warn-bg); border-color:var(--mnu-warn-border); }
.mnu-ok   { background:var(--mnu-ok-bg);   border-color:var(--mnu-ok-border); }
.mnu-step-body table {
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  font-size:0.85rem;
  border-radius:10px;
  overflow:hidden;
  background:rgba(0,0,0,0.15);
  border:1px solid var(--mnu-border);
}
[data-bs-theme="light"] .mnu-step-body table { background:rgba(0,0,0,0.02); }
.mnu-step-body th, .mnu-step-body td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--mnu-border); vertical-align:top; }
.mnu-step-body th { background:rgba(255,107,53,0.08); font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--mnu-primary); }
.mnu-step-body tr:last-child td { border-bottom:none; }
.mnu-empty { text-align:center; padding:60px 20px; color:var(--mnu-text-muted); font-size:0.95rem; }
.mnu-root mark { background:rgba(245,158,11,0.35); color:var(--mnu-text); padding:0 3px; border-radius:3px; }
.mnu-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:99; backdrop-filter:blur(3px); }
.mnu-overlay.active { display:block; }
#mnu-offline-banner {
  display:none;
  position:fixed;
  bottom:0; left:0; right:0;
  background:var(--brand-orange,#ff6b35);
  color:white;
  text-align:center;
  padding:10px 16px;
  font-size:0.85rem;
  font-weight:600;
  z-index:999;
  box-shadow:0 -2px 12px rgba(0,0,0,0.35);
}
body.mnu-is-offline { padding-bottom:44px; }
#mnu-install-btn {
  display:none;
  background:linear-gradient(135deg, var(--mnu-primary), var(--mnu-primary-hover));
  color:white;
  border-color:transparent;
}
#mnu-install-btn:hover { filter:brightness(1.1); }
#mnu-ios-hint {
  position:fixed;
  bottom:20px; left:20px; right:20px;
  background:var(--mnu-card);
  backdrop-filter:blur(20px);
  border:1px solid var(--mnu-border);
  border-radius:14px;
  padding:14px 42px 14px 16px;
  box-shadow:var(--mnu-shadow);
  font-size:0.85rem;
  z-index:998;
  line-height:1.5;
  color:var(--mnu-text);
}
#mnu-ios-hint-close {
  position:absolute;
  top:8px; right:8px;
  background:transparent;
  border:none;
  cursor:pointer;
  font-size:1rem;
  color:var(--mnu-text-muted);
  width:28px; height:28px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
#mnu-ios-hint-close:hover { background:rgba(255,255,255,0.06); }
@media (display-mode:standalone) {
  .mnu-topbar { padding-top:env(safe-area-inset-top, 14px); }
  #mnu-install-btn { display:none !important; }
}
@supports (padding:env(safe-area-inset-top)) {
  .mnu-sidebar {
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
}

/* ============================================================
   21. TOAST CONTAINER (CONSERVA TODAS TUS CLASES ORIGINALES)
   ============================================================ */
#toastContainer {
  position:fixed;
  top:70px;
  right:16px;
  z-index:999999;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
  max-width:min(360px, calc(100vw - 32px));
}
#toastContainer > * {
  pointer-events:auto;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-left:4px solid var(--primary);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.55);
  color:var(--text-main);
  font-size:0.82rem;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
  animation:toastSlideIn 0.25s ease-out;
  min-height:48px;
}
#toastContainer > .toast-success,
#toastContainer > .toast-exito    { border-left-color:var(--success); }
#toastContainer > .toast-error,
#toastContainer > .toast-danger   { border-left-color:var(--danger); }
#toastContainer > .toast-warning,
#toastContainer > .toast-advertencia { border-left-color:var(--warning); }
#toastContainer > .toast-info     { border-left-color:var(--info); }

@keyframes toastSlideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
@keyframes toastSlideOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(30px); } }

@media (max-width: 991px) {
  #toastContainer {
    top:auto;
    bottom:90px;
    left:12px; right:12px;
    max-width:none;
    align-items:stretch;
  }
  #toastContainer > * { animation:toastSlideUp 0.25s ease-out; }
  @keyframes toastSlideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
}

/* ============================================================
   22. OTRAS ANIMACIONES + GLOBAL LOADING
   ============================================================ */
@keyframes spinClockwise        { to { transform:rotate(360deg); } }
@keyframes spinCounterClockwise { to { transform:rotate(-360deg); } }
@keyframes pulseIcon            { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.1); opacity:0.8; } }
@keyframes floatParticle        { 0% { transform:translateY(0) translateX(0); opacity:0; } 10% { opacity:0.8; } 90% { opacity:0.6; } 100% { transform:translateY(-100vh) translateX(50px); opacity:0; } }
@keyframes slideIn              { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
@keyframes slideOut             { from { transform:translateX(0); opacity:1; } to { transform:translateX(100%); opacity:0; } }
@keyframes fadeOut              { from { opacity:1; } to { opacity:0; } }

#globalLoadingOverlay                   { pointer-events:all !important; }
#globalLoadingOverlay *                  { pointer-events:none; }
#globalLoadingOverlay button             { pointer-events:all; }

@keyframes blueGlassPulse {
  0%, 100% {
    box-shadow:
      0 8px 24px -8px rgba(0,0,0,0.45),
      0 0 0 0 rgba(59,130,246,0.20),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  50% {
    box-shadow:
      0 8px 24px -8px rgba(0,0,0,0.45),
      0 0 24px rgba(59,130,246,0.35),
      inset 0 1px 0 rgba(255,255,255,0.10);
  }
}
.navigation .logo-circle-glass { animation:blueGlassPulse 4s ease-in-out infinite; }

/* ============================================================
   23. SCROLLBAR azulada
   ============================================================ */
::-webkit-scrollbar           { width:8px; height:8px; }
::-webkit-scrollbar-track     { background:rgba(15,23,42,0.4); }
::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg, #3b82f6, #1d4ed8);
  border-radius:10px;
  border:1px solid rgba(96,165,250,0.20);
}
::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg, #60a5fa, #3b82f6); }
* {
  scrollbar-color:#3b82f6 rgba(15,23,42,0.4);
  scrollbar-width:thin;
}

.panel-head{margin-bottom:16px}
