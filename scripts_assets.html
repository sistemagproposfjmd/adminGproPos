<!-- ============================================================
     MANUAL — Lógica de la app
     ============================================================ -->
<script>
(function() {
  'use strict';

  // Solo correr si estamos en la página del manual
  if (!document.querySelector('.mnu-root')) return;

  const state = {
    lang: (document.body.dataset.lang || 'es').toLowerCase(),
    userEmail: document.body.dataset.user || 'anonimo',
    rol: { rol: 'admin', modulos: null },
    manual: null,
    activeModule: null,
    filtro: '',
    modulosPermitidos: null
  };

  /* ===== HELPERS ===== */
  function hl(text, term) {
    if (!term || !text) return text || '';
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return String(text).replace(re, '<mark>$1</mark>');
  }

  function getManualLocal(lang) {
    return window.MNU_DATA[lang] || window.MNU_DATA.es;
  }

  function aplicarPermisos(modulos) {
    if (!state.modulosPermitidos || !state.modulosPermitidos.length) return modulos;
    const permitidos = state.modulosPermitidos.map(s => s.toLowerCase());
    return modulos.filter(m =>
      permitidos.includes(m.id.toLowerCase()) ||
      permitidos.includes(m.nombre.toLowerCase())
    );
  }

  /* ===== INIT ===== */
  function initManual() {
    if (typeof google === 'undefined' || !google.script) {
      state.manual = getManualLocal(state.lang);
      state.activeModule = state.manual.modulos[0]?.id;
      actualizarBadgeUsuario();
      render();
      return;
    }

    google.script.run
      .withSuccessHandler(config => {
        state.rol = config.rol || state.rol;
        if (config.rol && config.rol.modulos) {
          state.modulosPermitidos = config.rol.modulos;
        }
        actualizarBadgeUsuario();
        cargarManual();
      })
      .withFailureHandler(() => {
        actualizarBadgeUsuario();
        cargarManual();
      })
      .getConfigClienteManual();
  }

  /* ===== CARGA ===== */
  function cargarManual() {
    const cacheKey = 'gpropos-manual-' + state.lang;
    const cachedRaw = localStorage.getItem(cacheKey);
    const cached = cachedRaw ? JSON.parse(cachedRaw) : null;

    if (typeof google === 'undefined' || !google.script) {
      if (cached) return aplicarYRender(cached);
      return aplicarYRender(getManualLocal(state.lang));
    }

    google.script.run
      .withSuccessHandler(desdeSheet => {
        let manual;
        if (desdeSheet && desdeSheet.length) {
          manual = { titulo: 'Manual de Usuario GProPOS', modulos: desdeSheet };
        } else {
          manual = getManualLocal(state.lang);
        }
        try {
          localStorage.setItem(cacheKey, JSON.stringify(manual));
          localStorage.setItem(cacheKey + '-date', new Date().toISOString());
        } catch (e) { console.warn('No se pudo cachear:', e); }
        aplicarYRender(manual);
      })
      .withFailureHandler(() => {
        if (cached) return aplicarYRender(cached);
        aplicarYRender(getManualLocal(state.lang));
      })
      .getManualData(state.lang);
  }

  function aplicarYRender(manual) {
    state.manual = manual;
    state.manual.modulos = aplicarPermisos(state.manual.modulos);
    state.activeModule = state.manual.modulos[0]?.id;
    render();
  }

  /* ===== RENDER ===== */
  function render() {
    const t = document.getElementById('mnu-manual-title');
    if (t) t.textContent = state.manual.titulo;
    document.documentElement.setAttribute('lang', state.lang);
    const lbl = document.getElementById('mnu-lang-label');
    if (lbl) lbl.textContent = state.lang.toUpperCase();
    renderSidebar();
    renderContent();
  }

  function renderSidebar() {
    const nav = document.getElementById('mnu-sidebar-nav');
    if (!nav) return;
    nav.innerHTML = '';
    state.manual.modulos.forEach(mod => {
      const btn = document.createElement('button');
      btn.className = 'mnu-nav-item' + (mod.id === state.activeModule ? ' active' : '');
      btn.innerHTML = `
        <span class="mnu-nav-icon">${mod.icono || '📄'}</span>
        <span class="mnu-nav-label">${mod.nombre}</span>
        <span class="mnu-nav-count">${mod.pasos.length}</span>
      `;
      btn.onclick = () => {
        state.activeModule = mod.id;
        location.hash = '#/' + mod.id;
        renderSidebar();
        renderContent();
        cerrarSidebarMovil();
        const body = document.getElementById('mnu-tab-content');
        if (body) body.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      nav.appendChild(btn);
    });
  }

  function renderContent() {
    const el = document.getElementById('mnu-tab-content');
    if (!el) return;
    const mod = state.manual.modulos.find(m => m.id === state.activeModule);
    if (!mod) {
      el.innerHTML = '<div class="mnu-empty">Módulo no disponible</div>';
      return;
    }

    const term = state.filtro.toLowerCase();
    el.innerHTML = '';

    const hdr = document.createElement('div');
    hdr.className = 'mnu-module-header';
    hdr.innerHTML = `
      <h2 class="mnu-module-title"><span>${mod.icono || ''}</span>${mod.nombre}</h2>
      <p class="mnu-module-desc">${hl(mod.descripcion, state.filtro)}</p>
    `;
    el.appendChild(hdr);

    const pasos = mod.pasos.filter(p => {
      if (!term) return true;
      const blob = (
        p.titulo + ' ' + p.detalle + ' ' +
        (p.items || []).join(' ') + ' ' +
        (p.nota || '') + ' ' +
        (p.tabla ? p.tabla.headers.join(' ') + ' ' + p.tabla.rows.flat().join(' ') : '')
      ).toLowerCase();
      return blob.includes(term);
    });

    if (!pasos.length) {
      el.innerHTML += `<div class="mnu-empty">Sin resultados para "<strong>${state.filtro}</strong>"</div>`;
      updateStats(0);
      return;
    }

    pasos.forEach((paso, i) => {
      const step = document.createElement('div');
      step.className = 'mnu-step' + (state.filtro ? ' open' : '');

      let body = `<p>${hl(paso.detalle || '', state.filtro)}</p>`;

      if (paso.items?.length) {
        body += '<ul>' + paso.items.map(it => `<li>${hl(it, state.filtro)}</li>`).join('') + '</ul>';
      }

      if (paso.img) {
        body += `<img src="${paso.img}" alt="${paso.titulo}" loading="lazy">`;
      }

      if (paso.video) {
        body += `<iframe src="${paso.video}" allowfullscreen loading="lazy"></iframe>`;
      }

      if (paso.tabla) {
        body += '<table><thead><tr>' +
          paso.tabla.headers.map(h => `<th>${hl(h, state.filtro)}</th>`).join('') +
          '</tr></thead><tbody>' +
          paso.tabla.rows.map(r =>
            '<tr>' + r.map(c => `<td>${hl(c, state.filtro)}</td>`).join('') + '</tr>'
          ).join('') +
          '</tbody></table>';
      }

      if (paso.nota) {
        const cls = paso.alerta === 'warn' ? 'mnu-warn' :
                    paso.alerta === 'ok'   ? 'mnu-ok'   : 'mnu-note';
        const ico = paso.alerta === 'warn' ? '⚠️' :
                    paso.alerta === 'ok'   ? '✅' : '💡';
        body += `<div class="${cls}">${ico} ${hl(paso.nota, state.filtro)}</div>`;
      }

      step.innerHTML = `
        <div class="mnu-step-header">
          <span class="mnu-step-number">${i + 1}</span>
          <span class="mnu-step-title">${hl(paso.titulo, state.filtro)}</span>
          <span class="mnu-step-toggle">▼</span>
        </div>
        <div class="mnu-step-body">${body}</div>
      `;

      step.querySelector('.mnu-step-header').onclick = () => step.classList.toggle('open');
      el.appendChild(step);
    });

    updateStats(pasos.length);
  }

  function updateStats(n) {
    const mod = state.manual.modulos.find(m => m.id === state.activeModule);
    const total = state.manual.modulos.reduce((a, m) => a + m.pasos.length, 0);
    const el = document.getElementById('mnu-footer-stats');
    if (el) {
      el.textContent = `${state.manual.modulos.length} módulos · ${total} pasos · Mostrando ${n} en "${mod?.nombre || ''}"`;
    }
  }

  function actualizarBadgeUsuario() {
    const email = state.userEmail;
    const emailEl = document.getElementById('mnu-user-email');
    const avatarEl = document.getElementById('mnu-user-avatar');
    const rolEl = document.getElementById('mnu-user-rol');
    if (emailEl) emailEl.textContent = email;
    if (avatarEl) avatarEl.textContent = (email[0] || '?').toUpperCase();
    const rolTexto = typeof state.rol === 'string' ? state.rol : (state.rol?.rol || 'operador');
    if (rolEl) rolEl.textContent = rolTexto;
  }

  /* ===== EVENTOS ===== */
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'mnu-search-input') {
      state.filtro = e.target.value.trim();
      renderContent();
    }
  });

  document.addEventListener('click', e => {
    if (e.target && e.target.id === 'mnu-theme-toggle') {
      const cur = document.documentElement.getAttribute('data-bs-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('gpropos-theme-manual', next);
      e.target.textContent = next === 'dark' ? '🌙' : '☀️';
    }
    if (e.target && e.target.id === 'mnu-lang-toggle') {
      state.lang = state.lang === 'es' ? 'en' : 'es';
      localStorage.setItem('gpropos-lang-manual', state.lang);
      cargarManual();
    }
    if (e.target && e.target.id === 'mnu-sidebar-toggle') {
      const s = document.getElementById('mnu-sidebar');
      const o = document.getElementById('mnu-overlay');
      if (s) s.classList.toggle('open');
      if (o) o.classList.toggle('active');
    }
    if (e.target && e.target.id === 'mnu-overlay') {
      cerrarSidebarMovil();
    }
    if (e.target && e.target.id === 'mnu-print-btn') {
      window.print();
    }
    if (e.target && e.target.id === 'mnu-refresh-btn') {
      if (!confirm('¿Actualizar la app? Se recargará el manual.')) return;
      (async () => {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        location.reload();
      })();
    }
    if (e.target && e.target.id === 'mnu-pdf-btn') {
      exportarPDF();
    }
  });

  function cerrarSidebarMovil() {
    const s = document.getElementById('mnu-sidebar');
    const o = document.getElementById('mnu-overlay');
    if (s) s.classList.remove('open');
    if (o) o.classList.remove('active');
  }

  /* ===== TEMA INICIAL ===== */
  const savedTheme = localStorage.getItem('gpropos-theme-manual') || 'dark';
  document.documentElement.setAttribute('data-bs-theme', savedTheme);
  const themeBtn = document.getElementById('mnu-theme-toggle');
  if (themeBtn) themeBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

  /* ===== EXPORTAR PDF ===== */
  function exportarPDF() {
    const w = window.open('', '_blank');
    if (!w) { alert('Permite las ventanas emergentes.'); return; }

    const todos = state.manual.modulos.map(mod => {
      const pasosHtml = mod.pasos.map((p, i) => `
        <div class="step-pdf">
          <h3>${i + 1}. ${p.titulo}</h3>
          <p>${p.detalle || ''}</p>
          ${p.items?.length ? '<ul>' + p.items.map(it => `<li>${it}</li>`).join('') + '</ul>' : ''}
          ${p.tabla ? '<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr>' +
            p.tabla.headers.map(h => `<th style="background:#eee;text-align:left">${h}</th>`).join('') +
            '</tr></thead><tbody>' +
            p.tabla.rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') +
            '</tbody></table>' : ''}
          ${p.nota ? `<div style="background:#fff3e6;border-left:4px solid #ff6b35;padding:8px 12px;margin-top:8px;font-size:12px">💡 ${p.nota}</div>` : ''}
        </div>
      `).join('');
      return `
        <section style="page-break-before:always">
          <h1 style="color:#ff6b35;border-bottom:2px solid #ff6b35;padding-bottom:8px">${mod.icono || ''} ${mod.nombre}</h1>
          <p style="color:#64748b;font-style:italic">${mod.descripcion || ''}</p>
          ${pasosHtml}
        </section>
      `;
    }).join('');

    w.document.write(`
      <!DOCTYPE html><html lang="${state.lang}"><head><meta charset="utf-8">
      <title>${state.manual.titulo} - PDF</title>
      <style>
        body { font-family: system-ui, sans-serif; padding: 30px; color: #1e293b; line-height: 1.55; }
        h1 { font-size: 22px; }
        h3 { font-size: 15px; color: #ff6b35; margin-top: 16px; }
        ul { padding-left: 22px; font-size: 13px; }
        .step-pdf { page-break-inside: avoid; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px dotted #cbd5e1; }
        table th { font-size: 11px; text-transform: uppercase; }
        @media print { body { padding: 10px; } section { page-break-before: always; } }
      </style></head><body>
        <h1 style="text-align:center;color:#ff6b35">${state.manual.titulo}</h1>
        <p style="text-align:center;color:#64748b;margin-bottom:30px">Generado el ${new Date().toLocaleString()}</p>
        ${todos}
      </body></html>
    `);
    w.document.close();
    setTimeout(() => w.print(), 400);
  }

  /* ===== ROUTER ===== */
  function routeFromHash() {
    const hash = location.hash.replace('#/', '');
    if (hash && state.manual?.modulos.some(m => m.id === hash)) {
      state.activeModule = hash;
      renderSidebar();
      renderContent();
    }
  }
  window.addEventListener('hashchange', routeFromHash);

  /* ===== INIT ===== */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initManual);
  } else {
    initManual();
  }
})();
</script>

<!-- ============================================================
     MANUAL — Service Worker PWA + Offline
     ============================================================ -->
<script>
(function() {
  if (!document.querySelector('.mnu-root')) return;

  const CACHE_NAME = 'gpropos-manual-v1';
  const SW_CODE = `
const CACHE_NAME = '${CACHE_NAME}';
const APP_SHELL = ['./', './index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(APP_SHELL).catch(() => {})));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  const req = e.request;
  if (req.method !== 'GET') return;
  e.respondWith(
    caches.match(req).then(cached => cached || fetch(req).then(res => {
      if (res && res.status === 200 && res.type === 'basic') {
        const clone = res.clone();
        caches.open(CACHE_NAME).then(c => c.put(req, clone));
      }
      return res;
    }).catch(() => caches.match('./index.html')))
  );
});
`;

  async function registrarSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      console.log('✅ SW registrado (archivo)');
    } catch (err) {
      try {
        const blob = new Blob([SW_CODE], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        await navigator.serviceWorker.register(url, { scope: './' });
        console.log('✅ SW registrado (blob)');
      } catch (err2) {
        console.warn('⚠️ SW no disponible, offline por localStorage');
        try {
          localStorage.setItem('gpropos-app-shell', document.documentElement.outerHTML);
          localStorage.setItem('gpropos-app-shell-date', new Date().toISOString());
        } catch (e) {}
      }
    }
  }

  /* Prompt instalación */
  let deferredPrompt = null;
  const installBtn = document.getElementById('mnu-install-btn');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.style.display = 'flex';
  });
  if (installBtn) {
    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    };
  }
  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.style.display = 'none';
  });

  /* Hint iOS */
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const standalone = window.matchMedia('(display-mode: standalone)').matches;
  if (esIOS && !standalone) {
    const b = document.createElement('div');
    b.id = 'mnu-ios-hint';
    b.innerHTML = `
      <button id="mnu-ios-hint-close" aria-label="Cerrar">✕</button>
      📲 Para instalar: toca <strong>Compartir</strong> → <strong>Añadir a pantalla de inicio</strong>
    `;
    document.body.appendChild(b);
    document.getElementById('mnu-ios-hint-close').onclick = () => b.remove();
  }

  /* Online/Offline */
  function updateConexion() {
    const offline = !navigator.onLine;
    document.body.classList.toggle('mnu-is-offline', offline);
    let b = document.getElementById('mnu-offline-banner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'mnu-offline-banner';
      b.textContent = '📴 Estás sin conexión · Mostrando versión guardada';
      document.body.appendChild(b);
    }
    b.style.display = offline ? 'block' : 'none';
  }
  window.addEventListener('online', updateConexion);
  window.addEventListener('offline', updateConexion);

  if (document.readyState === 'complete') registrarSW();
  else window.addEventListener('load', registrarSW);
  updateConexion();
})();
</script>
