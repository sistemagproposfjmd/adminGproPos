</style>

<script>
// ==================== MÓDULO PLAN DE CUENTAS CONTABLE ====================
(function() { 'use strict'; var allData = []; var filteredData = []; var currentPage = 1; var pageSize = 50; var selectedRows = new Set(); var sortColumn = -1; var sortDirection = 'asc'; var isInitialized = false;

// ==================== 1. MOSTRAR TOAST ====================
function showToast(msg, type) { type = type || 'info'; if (typeof Swal !== 'undefined') { var icons = { success: 'success', error: 'error', warning: 'warning', info: 'info' }; Swal.fire({ toast: true, position: 'top-end', icon: icons[type] || 'info', title: msg, showConfirmButton: false, timer: 3000, timerProgressBar: true }); } }

// ==================== 2. MOSTRAR LOADER ====================
function showLoader() { var overlay = document.getElementById('globalLoadingOverlay'); if (overlay) overlay.style.display = 'flex'; }

// ==================== 3. OCULTAR LOADER ====================
function hideLoader() { var overlay = document.getElementById('globalLoadingOverlay'); if (overlay) overlay.style.display = 'none'; }

// ==================== 4. ESCAPE HTML ====================
function escapeHtml(text) { if (text === null || text === undefined) return ''; if (typeof text !== 'string') text = String(text); var div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

// ==================== 5. CARGAR DATOS ====================
function loadData() { showLoader(); if (typeof google === 'undefined' || !google.script || !google.script.run) { hideLoader(); showToast('Error: Google Apps Script no disponible', 'error'); document.getElementById('planCuentasTbody').innerHTML = '<tr><td colspan="8" class="plan-cuentas-empty-state"><p>Error de conexión con el servidor</p></td></tr>'; return; } google.script.run.withSuccessHandler(function(data) { allData = Array.isArray(data) ? data : []; filteredData = allData.slice(); currentPage = 1; selectedRows.clear(); renderTable(); hideLoader(); if (allData.length > 0) { showToast('Plan de cuentas cargado (' + allData.length + ' registros)', 'success'); } else { showToast('No se encontraron datos en PlandeCuentas', 'warning'); } }).withFailureHandler(function(error) { hideLoader(); showToast('Error: ' + (error.message || 'Error desconocido'), 'error'); document.getElementById('planCuentasTbody').innerHTML = '<tr><td colspan="8" class="plan-cuentas-empty-state"><p>Error al cargar: ' + escapeHtml(error.message || 'Error desconocido') + '</p><button class="plan-cuentas-btn" onclick="window.PlanCuentasModule.loadData()">Reintentar</button></td></tr>'; }).getDataPlanCuentas(); }

// ==================== 6. RENDER TABLA ====================
function renderTable() { var tbody = document.getElementById('planCuentasTbody'); if (!tbody) return; var start = (currentPage - 1) * pageSize; var end = Math.min(start + pageSize, filteredData.length); var pageData = filteredData.slice(start, end); if (pageData.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="plan-cuentas-empty-state"><p>No se encontraron registros</p><small class="text-muted">Intente ajustar los filtros de búsqueda</small></td></tr>'; document.getElementById('planCuentasPaginationInfo').textContent = '0 registros'; document.getElementById('planCuentasPaginationControls').innerHTML = ''; document.getElementById('planCuentasSelectedCount').textContent = '0'; return; } var html = ''; pageData.forEach(function(row, idx) { var globalIndex = start + idx; var isSelected = selectedRows.has(globalIndex); var agrupacion = row.Agrupacion || row.agrupacion || ''; var cuentaContable = row.CuentaContable || row['Cuenta Contable'] || row.cuentaContable || ''; var cuenta = row.Cuenta || row.cuenta || ''; var eeff = row.EEFF || row.eeff || ''; var tipo = row.Tipo || row.tipo || ''; var tipoCuenta = row.TipoCuenta || row['Tipo Cuenta'] || row.tipoCuenta || ''; var grupoBalance = row.GrupoBalance || row['Grupo Balance'] || row.grupoBalance || ''; html += '<tr class="' + (isSelected ? 'selected' : '') + '" onclick="window.PlanCuentasModule.rowClick(event, ' + globalIndex + ')" style="cursor: pointer;"><td onclick="event.stopPropagation()"><input type="checkbox" class="plan-cuentas-checkbox" ' + (isSelected ? 'checked' : '') + ' onchange="window.PlanCuentasModule.toggleRow(' + globalIndex + ', this)" onclick="event.stopPropagation()"></td><td><strong>' + escapeHtml(agrupacion) + '</strong></td><td style="font-family: monospace; font-weight: 600;">' + escapeHtml(cuentaContable) + '</td><td>' + escapeHtml(cuenta) + '</td><td class="plan-cuentas-text-center"><span class="plan-cuentas-badge">' + escapeHtml(eeff) + '</span></td><td class="plan-cuentas-text-center">' + escapeHtml(tipo) + '</td><td class="plan-cuentas-text-center">' + escapeHtml(tipoCuenta) + '</td><td>' + escapeHtml(grupoBalance) + '</td></tr>'; }); tbody.innerHTML = html; document.getElementById('planCuentasPaginationInfo').textContent = 'Mostrando ' + (start + 1) + '-' + end + ' de ' + filteredData.length; document.getElementById('planCuentasSelectedCount').textContent = selectedRows.size; updatePagination(); updateSelectAllCheckbox(); var allTh = document.querySelectorAll('#planCuentasTable thead th[onclick]'); allTh.forEach(function(th) { th.classList.remove('plan-cuentas-sorted-asc', 'plan-cuentas-sorted-desc'); }); if (sortColumn >= 0) { var th = document.getElementById('planCuentasTh' + sortColumn); if (th) { th.classList.add(sortDirection === 'asc' ? 'plan-cuentas-sorted-asc' : 'plan-cuentas-sorted-desc'); } } }

// ==================== 7. ACTUALIZAR CHECKBOX SELECT ALL ====================
function updateSelectAllCheckbox() { var selectAll = document.getElementById('planCuentasSelectAllCheckbox'); if (!selectAll) return; var start = (currentPage - 1) * pageSize; var end = Math.min(start + pageSize, filteredData.length); var total = end - start; var selected = 0; for (var i = start; i < end; i++) { if (selectedRows.has(i)) selected++; } selectAll.checked = (total > 0 && selected === total); selectAll.indeterminate = (selected > 0 && selected < total); }

// ==================== 8. ACTUALIZAR PAGINACIÓN ====================
function updatePagination() { var container = document.getElementById('planCuentasPaginationControls'); if (!container) return; var totalPages = Math.ceil(filteredData.length / pageSize) || 1; if (totalPages <= 1) { container.innerHTML = '<span style="color: var(--bs-secondary-color); font-size: 0.8rem;">Página 1 de 1</span>'; return; } var html = ''; html += '<button onclick="window.PlanCuentasModule.goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>«</button>'; html += '<button onclick="window.PlanCuentasModule.goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>‹</button>'; var startPage = Math.max(1, currentPage - 2); var endPage = Math.min(totalPages, startPage + 4); if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4); for (var i = startPage; i <= endPage; i++) { html += '<button onclick="window.PlanCuentasModule.goToPage(' + i + ')" class="' + (i === currentPage ? 'active' : '') + '">' + i + '</button>'; } html += '<button onclick="window.PlanCuentasModule.goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>›</button>'; html += '<button onclick="window.PlanCuentasModule.goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>»</button>'; container.innerHTML = html; }

// ==================== 9. OBTENER DATOS SELECCIONADOS ====================
